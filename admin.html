<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111118">
<title>Administración | Watch TV Plus</title>
<style>
:root{--bg:#0f0f16;--panel:#1a1a24;--panel2:#242432;--text:#f7f7f9;--muted:#a5a5b2;--blue:#4c78ff;--green:#2eb872;--yellow:#e0a93a;--red:#ef5b70;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}
.hidden{display:none!important}
.login-screen{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#202033 0,#0f0f16 55%)}
.login-card{width:min(100%,420px);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 25px 70px rgba(0,0,0,.5)}
.login-card h1{margin:0 0 5px;font-size:23px}.login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;margin:14px 0 7px;font-size:12px;font-weight:900}
input,select{width:100%;min-height:43px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:#fff;padding:0 11px;outline:none}
.login-btn{width:100%;margin-top:18px;min-height:46px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}
.login-error{display:none;margin-top:13px;padding:11px;border-radius:9px;background:rgba(239,91,112,.13);color:#ffb0bc;font-size:12px}.login-error.show{display:block}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:rgba(20,20,29,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{font-size:20px;font-weight:900}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:400}
.actions{display:flex;gap:8px;align-items:center}button{border:0;border-radius:9px;padding:10px 13px;color:#fff;background:#30303f;cursor:pointer;font-weight:900}button.primary{background:var(--blue)}button.danger{background:#7d2938}button:disabled{opacity:.45;cursor:not-allowed}
main{width:min(100%,1320px);margin:0 auto;padding:18px}.notice{display:none;margin-bottom:14px;padding:12px;border-radius:10px;background:rgba(239,91,112,.13);color:#ffb0bc;border:1px solid rgba(239,91,112,.3);font-size:13px}.notice.show{display:block}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat b{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.panel-title{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid var(--line);font-weight:900}
.filters{display:grid;grid-template-columns:1fr 180px auto;gap:9px;padding:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12px}th{position:sticky;top:0;background:#222230;color:#d0d0d8;font-size:11px;text-transform:uppercase}
.channel-name{font-weight:900;font-size:13px}.sub{margin-top:4px;color:var(--muted);font-size:11px;max-width:290px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:rgba(224,169,58,.15);color:#ffd77d}.reviewing{background:rgba(76,120,255,.16);color:#9db7ff}.fixed{background:rgba(46,184,114,.15);color:#91efba}.discarded{background:rgba(239,91,112,.15);color:#ffafbb}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button,.row-actions a{padding:7px 9px;border-radius:7px;font-size:10px;text-decoration:none;color:#fff;background:#30303f;font-weight:900}.empty{padding:35px;text-align:center;color:var(--muted)}
.ranking{padding:8px 14px 14px}.rank-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.rank-num{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#2b2b39;font-size:11px;font-weight:900}.rank-name{font-size:12px;font-weight:900}.rank-meta{margin-top:3px;color:var(--muted);font-size:10px}.rank-count{font-size:14px;font-weight:900;color:#ffcb69}
.history{max-height:370px;overflow:auto;padding:6px 14px 14px}.history-item{padding:11px 0;border-bottom:1px solid var(--line)}.history-item b{font-size:12px}.history-item div{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.45}
.toast{position:fixed;right:18px;bottom:18px;z-index:50;display:none;max-width:360px;padding:14px 16px;border-radius:12px;background:#24392e;color:#aaf1c6;border:1px solid rgba(46,184,114,.4);font-size:13px;font-weight:800}.toast.show{display:block}
@media(max-width:980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>Watch TV Plus</h1>
    <p>Acceso privado al panel de administración</p>
    <label for="username">Usuario</label>
    <input id="username" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="login-btn" id="loginBtn" type="submit">Iniciar sesión</button>
    <div class="login-error" id="loginError"></div>
  </form>
</section>

<div id="dashboard" class="hidden">
<header class="topbar">
  <div class="brand">Watch TV Plus <small>Panel protegido</small></div>
  <div class="actions"><button id="refreshBtn" class="primary">Actualizar</button><button id="logoutBtn">Cerrar sesión</button></div>
</header>
<main>
  <div class="notice" id="notice"></div>
  <section class="stats">
    <div class="stat"><b id="totalStat">0</b><span>Total</span></div>
    <div class="stat"><b id="pendingStat">0</b><span>Pendientes</span></div>
    <div class="stat"><b id="reviewingStat">0</b><span>En revisión</span></div>
    <div class="stat"><b id="fixedStat">0</b><span>Reparados</span></div>
    <div class="stat"><b id="discardedStat">0</b><span>Descartados</span></div>
  </section>
  <section class="grid">
    <div class="panel">
      <div class="panel-title"><span>Reportes recibidos</span><small id="updatedAt">Sin actualizar</small></div>
      <div class="filters">
        <input id="searchInput" type="search" placeholder="Buscar canal, motivo o sección...">
        <select id="statusFilter"><option value="">Todos los estados</option><option>Pendiente</option><option>En revisión</option><option>Reparado</option><option>Descartado</option></select>
        <button id="clearBtn">Limpiar filtros</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Canal</th><th>Problema</th><th>Estado</th><th>Reportes</th><th>Acciones</th></tr></thead><tbody id="reportBody"></tbody></table><div class="empty" id="emptyBox">Cargando...</div></div>
    </div>
    <aside>
      <div class="panel" style="margin-bottom:14px"><div class="panel-title">Canales más reportados</div><div class="ranking" id="rankingBox"></div></div>
      <div class="panel"><div class="panel-title">Historial reciente</div><div class="history" id="historyBox"></div></div>
    </aside>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbx0xQsu7a6fVQqNETwIdQv-PebzpHq2MQCbTHfHu_7Rqq2-l3eAKgoppzFsBiTe6VTS/exec";
const SESSION_KEY="watch_tv_plus_admin_session";
const POLL_INTERVAL=30000;
let sessionToken=sessionStorage.getItem(SESSION_KEY)||"";
let reports=[];let pollTimer=null;let lastKnownTotal=0;
const loginScreen=document.getElementById("loginScreen"),dashboard=document.getElementById("dashboard"),loginError=document.getElementById("loginError"),body=document.getElementById("reportBody"),emptyBox=document.getElementById("emptyBox"),notice=document.getElementById("notice"),searchInput=document.getElementById("searchInput"),statusFilter=document.getElementById("statusFilter"),toast=document.getElementById("toast");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function showLogin(){dashboard.classList.add("hidden");loginScreen.classList.remove("hidden")}
function showDashboard(){loginScreen.classList.add("hidden");dashboard.classList.remove("hidden")}
function showError(m){loginError.textContent=m;loginError.classList.add("show")}
function showNotice(m){notice.textContent=m;notice.classList.add("show")}
function showToast(m){toast.textContent=m;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),4500)}
async function api(params,method="GET",auth=true){
  const data=new URLSearchParams(params);
  if(auth&&sessionToken)data.set("session",sessionToken);
  const options=method==="POST"?{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:data.toString()}:{};
  const url=method==="GET"?API_URL+"?"+data.toString():API_URL;
  const response=await fetch(url,options);const result=await response.json();
  if(!result.ok)throw new Error(result.error||"Error del servidor");return result;
}
document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();loginError.classList.remove("show");const btn=document.getElementById("loginBtn");btn.disabled=true;btn.textContent="Entrando...";
  try{const result=await api({action:"login",username:document.getElementById("username").value,password:document.getElementById("password").value},"POST",false);sessionToken=result.session;sessionStorage.setItem(SESSION_KEY,sessionToken);showDashboard();await loadDashboard(false);startPolling();}
  catch(err){showError("Usuario o contraseña incorrectos.");}finally{btn.disabled=false;btn.textContent="Iniciar sesión";}
});
document.getElementById("logoutBtn").addEventListener("click",async()=>{try{await api({action:"logout"},"POST")}catch(e){}sessionToken="";sessionStorage.removeItem(SESSION_KEY);clearInterval(pollTimer);showLogin();});
async function verifySession(){if(!sessionToken){showLogin();return}try{await api({action:"verify"});showDashboard();await loadDashboard(false);startPolling();}catch(e){sessionToken="";sessionStorage.removeItem(SESSION_KEY);showLogin();}}
async function loadDashboard(silent=false){
  try{const result=await api({action:"dashboard"});const total=Number(result.stats?.total||0);if(lastKnownTotal&&total>lastKnownTotal)showToast(`Hay ${total-lastKnownTotal} reporte(s) nuevo(s).`);lastKnownTotal=total;reports=result.reports||[];updateStats(result.stats||{});renderRanking(result.ranking||[]);renderHistory(result.history||[]);renderReports();document.getElementById("updatedAt").textContent="Actualizado: "+new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});}
  catch(err){if(String(err.message).includes("Sesión")){sessionToken="";sessionStorage.removeItem(SESSION_KEY);showLogin();}else if(!silent)showNotice("No se pudo cargar el panel.");}
}
function updateStats(s){for(const [id,key] of [["totalStat","total"],["pendingStat","pending"],["reviewingStat","reviewing"],["fixedStat","fixed"],["discardedStat","discarded"]])document.getElementById(id).textContent=s[key]||0}
function statusClass(s){return s==="Reparado"?"fixed":s==="En revisión"?"reviewing":s==="Descartado"?"discarded":"pending"}
function renderReports(){const q=searchInput.value.trim().toLowerCase(),state=statusFilter.value;const filtered=reports.filter(r=>(!q||`${r.canal} ${r.motivo} ${r.detalles} ${r.seccion}`.toLowerCase().includes(q))&&(!state||r.estado===state));body.innerHTML="";emptyBox.style.display=filtered.length?"none":"block";filtered.forEach(r=>{const tr=document.createElement("tr");const link=r.stream?`<a href="${esc(r.stream)}" target="_blank" rel="noopener">Abrir stream</a>`:"";tr.innerHTML=`<td>${esc(r.fechaTexto)}<div class="sub">${esc(r.contacto||"Sin contacto")}</div></td><td><div class="channel-name">${esc(r.canal)}</div><div class="sub">#${esc(r.numero)} · ${esc(r.seccion)} · ${esc(r.categoria)}</div></td><td><b>${esc(r.motivo)}</b><div class="sub">${esc(r.detalles||"Sin detalles")}</div></td><td><span class="badge ${statusClass(r.estado)}">${esc(r.estado)}</span></td><td>${esc(r.cantidad||1)}</td><td><div class="row-actions"><button data-action="review" data-id="${esc(r.id)}">Revisar</button><button data-action="fixed" data-id="${esc(r.id)}">Reparado</button><button data-action="discard" data-id="${esc(r.id)}">Descartar</button><button data-action="delete" data-id="${esc(r.id)}">Eliminar</button>${link}</div></td>`;body.appendChild(tr)})}
function renderRanking(items){document.getElementById("rankingBox").innerHTML=items.length?items.map((x,i)=>`<div class="rank-item"><div class="rank-num">${i+1}</div><div><div class="rank-name">${esc(x.canal)}</div><div class="rank-meta">${esc(x.seccion||"TV")}</div></div><div class="rank-count">${esc(x.cantidad)}</div></div>`).join(""):'<div class="empty">Sin datos.</div>'}
function renderHistory(items){document.getElementById("historyBox").innerHTML=items.length?items.map(x=>`<div class="history-item"><b>${esc(x.canal)} · ${esc(x.accion)}</b><div>${esc(x.fechaTexto)} · ${esc(x.detalle||"")}</div></div>`).join(""):'<div class="empty">Sin historial.</div>'}
body.addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==="delete"&&!confirm("¿Eliminar este reporte?"))return;b.disabled=true;try{if(action==="delete")await api({action:"delete",id},"POST");else await api({action:"update",id,estado:action==="review"?"En revisión":action==="fixed"?"Reparado":"Descartado"},"POST");await loadDashboard(true)}catch(err){showNotice("No se pudo completar la acción.")}finally{b.disabled=false}});
searchInput.addEventListener("input",renderReports);statusFilter.addEventListener("change",renderReports);document.getElementById("refreshBtn").addEventListener("click",()=>loadDashboard(false));document.getElementById("clearBtn").addEventListener("click",()=>{searchInput.value="";statusFilter.value="";renderReports()});
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==="visible")loadDashboard(true)},POLL_INTERVAL)}
verifySession();
</script>
</body>
</html>
