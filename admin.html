<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111118"><title>Administración | Watch TV Plus</title>
<style>
:root{--bg:#0f0f16;--panel:#1a1a24;--panel2:#242432;--text:#f7f7f9;--muted:#a5a5b2;--blue:#4c78ff;--green:#2eb872;--yellow:#e0a93a;--red:#ef5b70;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}
.login-screen{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#202033,#0f0f16 55%)}.login-card{width:min(100%,420px);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.login-card h1{margin:0 0 5px}.login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;margin:14px 0 7px;font-size:12px;font-weight:900}input,select{width:100%;min-height:43px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:#fff;padding:0 11px}button{border:0;border-radius:9px;padding:10px 13px;color:#fff;background:#30303f;cursor:pointer;font-weight:900}button.primary{background:var(--blue)}button:disabled{opacity:.45}.login-btn{width:100%;margin-top:18px;min-height:46px;background:var(--blue)}.message{display:none;margin-top:13px;padding:11px;border-radius:9px;background:rgba(239,91,112,.13);color:#ffb0bc;font-size:12px}.message.show{display:block}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:rgba(20,20,29,.96);border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.actions{display:flex;gap:8px}
main{width:min(100%,1320px);margin:auto;padding:18px}.notice{display:none;margin-bottom:14px;padding:12px;border-radius:10px;background:rgba(239,91,112,.13);color:#ffb0bc}.notice.show{display:block}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat b{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.panel-title{display:flex;justify-content:space-between;padding:14px 15px;border-bottom:1px solid var(--line);font-weight:900}
.filters{display:grid;grid-template-columns:1fr 180px auto;gap:9px;padding:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12px}th{background:#222230;color:#d0d0d8;font-size:11px;text-transform:uppercase}.channel-name{font-weight:900}.sub{margin-top:4px;color:var(--muted);font-size:11px;max-width:290px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:rgba(224,169,58,.15);color:#ffd77d}.reviewing{background:rgba(76,120,255,.16);color:#9db7ff}.fixed{background:rgba(46,184,114,.15);color:#91efba}.discarded{background:rgba(239,91,112,.15);color:#ffafbb}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button,.row-actions a{padding:7px 9px;border-radius:7px;font-size:10px;text-decoration:none;color:#fff;background:#30303f;font-weight:900}.empty{padding:35px;text-align:center;color:var(--muted)}
.ranking{padding:8px 14px 14px}.rank-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.rank-num{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#2b2b39;font-size:11px;font-weight:900}.rank-name{font-size:12px;font-weight:900}.rank-meta{margin-top:3px;color:var(--muted);font-size:10px}.rank-count{font-weight:900;color:#ffcb69}.history{max-height:390px;overflow:auto;padding:6px 14px 14px}.history-item{padding:11px 0;border-bottom:1px solid var(--line)}.history-item b{font-size:12px}.history-item div{margin-top:4px;color:var(--muted);font-size:10px}
@media(max-width:980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="login-screen" id="loginScreen"><form class="login-card" id="loginForm"><h1>Watch TV Plus</h1><p>Panel de reportes Cloudflare</p><label>Usuario</label><input id="username" value="admin" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button class="login-btn">Iniciar sesión</button><div class="message" id="loginMessage"></div></form></section>
<div id="dashboard" class="hidden"><header class="topbar"><div class="brand">Watch TV Plus <small>Cloudflare Admin 6.0</small></div><div class="actions"><button class="primary" id="refreshBtn">Actualizar</button><button id="logoutBtn">Cerrar sesión</button></div></header>
<main><div class="notice" id="notice"></div><section class="stats"><div class="stat"><b id="totalStat">0</b><span>Total</span></div><div class="stat"><b id="pendingStat">0</b><span>Pendientes</span></div><div class="stat"><b id="reviewingStat">0</b><span>En revisión</span></div><div class="stat"><b id="fixedStat">0</b><span>Reparados</span></div><div class="stat"><b id="discardedStat">0</b><span>Descartados</span></div></section>
<section class="grid"><div class="panel"><div class="panel-title"><span>Reportes recibidos</span><small id="updatedAt">Sin actualizar</small></div><div class="filters"><input id="searchInput" type="search" placeholder="Buscar canal..."><select id="statusFilter"><option value="">Todos los estados</option><option>Pendiente</option><option>En revisión</option><option>Reparado</option><option>Descartado</option></select><button id="clearBtn">Limpiar</button></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Canal</th><th>Problema</th><th>Estado</th><th>Reportes</th><th>Acciones</th></tr></thead><tbody id="reportBody"></tbody></table><div class="empty" id="emptyBox">Cargando...</div></div></div>
<aside><div class="panel" style="margin-bottom:14px"><div class="panel-title">Más reportados</div><div class="ranking" id="rankingBox"></div></div><div class="panel"><div class="panel-title">Historial</div><div class="history" id="historyBox"></div></div></aside></section></main></div>
<script src="./config.js"></script>
<script>
"use strict";
const API_URL=window.WATCH_TV_CONFIG.API_URL;
const TOKEN_KEY="wtv_cloudflare_admin_token";
let token=sessionStorage.getItem(TOKEN_KEY)||"",reports=[];
const loginScreen=document.getElementById("loginScreen"),dashboard=document.getElementById("dashboard"),loginMessage=document.getElementById("loginMessage"),body=document.getElementById("reportBody"),emptyBox=document.getElementById("emptyBox"),notice=document.getElementById("notice"),searchInput=document.getElementById("searchInput"),statusFilter=document.getElementById("statusFilter");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function showLogin(){dashboard.classList.add("hidden");loginScreen.classList.remove("hidden")}function showDashboard(){loginScreen.classList.add("hidden");dashboard.classList.remove("hidden")}function showNotice(m){notice.textContent=m;notice.classList.add("show")}
async function api(path,options={}){const headers={...(options.headers||{})};if(token)headers.Authorization="Bearer "+token;if(options.body)headers["Content-Type"]="application/json";const response=await fetch(API_URL+path,{...options,headers});const result=await response.json();if(!response.ok||!result.ok){const e=new Error(result.error||"Error del servidor");e.status=response.status;throw e}return result}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();loginMessage.classList.remove("show");try{const r=await api("/api/login",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});token=r.token;sessionStorage.setItem(TOKEN_KEY,token);showDashboard();await loadDashboard()}catch(err){loginMessage.textContent=err.message;loginMessage.classList.add("show")}};
document.getElementById("logoutBtn").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}catch(e){}token="";sessionStorage.removeItem(TOKEN_KEY);showLogin()};
async function loadDashboard(){try{notice.classList.remove("show");const r=await api("/api/dashboard");reports=r.reports||[];updateStats(r.stats||{});renderRanking(r.ranking||[]);renderHistory(r.history||[]);renderReports();updatedAt.textContent="Actualizado: "+new Date().toLocaleTimeString()}catch(err){if(err.status===401){token="";sessionStorage.removeItem(TOKEN_KEY);showLogin()}else showNotice(err.message)}}
function updateStats(s){for(const [id,k] of [["totalStat","total"],["pendingStat","pending"],["reviewingStat","reviewing"],["fixedStat","fixed"],["discardedStat","discarded"]])document.getElementById(id).textContent=s[k]||0}
function statusClass(s){return s==="Reparado"?"fixed":s==="En revisión"?"reviewing":s==="Descartado"?"discarded":"pending"}
function dateText(v){if(!v)return"";const d=new Date(String(v).replace(" ","T")+"Z");return isNaN(d)?v:d.toLocaleString("es-MX")}
function renderReports(){const q=searchInput.value.toLowerCase(),st=statusFilter.value;const filtered=reports.filter(r=>(!q||`${r.canal} ${r.motivo} ${r.detalles} ${r.seccion}`.toLowerCase().includes(q))&&(!st||r.estado===st));body.innerHTML="";emptyBox.style.display=filtered.length?"none":"block";filtered.forEach(r=>{const tr=document.createElement("tr");const link=r.stream?`<a href="${esc(r.stream)}" target="_blank" rel="noopener">Stream</a>`:"";tr.innerHTML=`<td>${esc(dateText(r.actualizacion||r.fecha))}</td><td><div class="channel-name">${esc(r.canal)}</div><div class="sub">#${esc(r.numero)} · ${esc(r.seccion)} · ${esc(r.categoria)}</div></td><td><b>${esc(r.motivo)}</b><div class="sub">${esc(r.detalles||"Sin detalles")}</div></td><td><span class="badge ${statusClass(r.estado)}">${esc(r.estado)}</span></td><td>${esc(r.cantidad)}</td><td><div class="row-actions"><button data-state="En revisión" data-id="${r.id}">Revisar</button><button data-state="Reparado" data-id="${r.id}">Reparado</button><button data-state="Descartado" data-id="${r.id}">Descartar</button><button data-delete data-id="${r.id}">Eliminar</button>${link}</div></td>`;body.appendChild(tr)})}
function renderRanking(items){rankingBox.innerHTML=items.length?items.map((x,i)=>`<div class="rank-item"><div class="rank-num">${i+1}</div><div><div class="rank-name">${esc(x.canal)}</div><div class="rank-meta">${esc(x.seccion||"TV")}</div></div><div class="rank-count">${x.cantidad}</div></div>`).join(""):'<div class="empty">Sin datos</div>'}
function renderHistory(items){historyBox.innerHTML=items.length?items.map(x=>`<div class="history-item"><b>${esc(x.canal)} · ${esc(x.accion)}</b><div>${esc(dateText(x.fecha))} · ${esc(x.detalle||"")} · ${esc(x.actor||"")}</div></div>`).join(""):'<div class="empty">Sin historial</div>'}
body.onclick=async e=>{const b=e.target.closest("button[data-state],button[data-delete]");if(!b)return;const id=b.dataset.id;if(b.hasAttribute("data-delete")&&!confirm("¿Eliminar este reporte?"))return;b.disabled=true;try{if(b.hasAttribute("data-delete"))await api("/api/reports/"+id,{method:"DELETE"});else await api("/api/reports/"+id,{method:"PATCH",body:JSON.stringify({estado:b.dataset.state})});await loadDashboard()}catch(err){showNotice(err.message)}finally{b.disabled=false}};
searchInput.oninput=renderReports;statusFilter.onchange=renderReports;clearBtn.onclick=()=>{searchInput.value="";statusFilter.value="";renderReports()};refreshBtn.onclick=loadDashboard;
if(token){showDashboard();loadDashboard()}else showLogin();setInterval(()=>{if(token&&document.visibilityState==="visible")loadDashboard()},30000);
</script>
</body>
</html>
