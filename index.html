<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Watch TV Plus</title>

<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@clappr/hlsjs-playback@latest/dist/hlsjs-playback.min.js"></script>

<style>
:root{
  --background:#000;
  --panel:rgba(4,6,10,.93);
  --panel-soft:rgba(15,18,25,.92);
  --text:#fff;
  --soft:#a9afbd;
  --red:#ff304f;
  --safe-x:clamp(10px,2vw,26px);
  --safe-y:clamp(8px,1.6vh,18px);
  --bottom-ui-height:clamp(185px,32vh,260px);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overscroll-behavior:none;
}

button,
input,
select{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
}

.sr-only{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  margin:-1px!important;
  padding:0!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  border:0!important;
}

/* =====================================================
   ESTRUCTURA PRINCIPAL
   ===================================================== */

.tv-app,
.player-shell,
.player-stage{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  max-height:100dvh;
  overflow:hidden;
}

.player-stage{
  position:relative;
  isolation:isolate;
  background:#000;
  cursor:default;
}

#player{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  background:#000;
}

#player video{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  background:#000!important;
}

#player .media-control,
#player .player-error-screen{
  display:none!important;
}

.video-vignette{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.18) 0%,
      transparent 28%,
      transparent 53%,
      rgba(0,0,0,.94) 100%
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.16),
      transparent 24%,
      transparent 76%,
      rgba(0,0,0,.16)
    );
  transition:opacity .35s ease;
}

/* =====================================================
   INFORMACIÓN DEL CANAL
   ===================================================== */

.now-playing{
  position:absolute;
  z-index:50;
  top:var(--safe-y);
  left:var(--safe-x);
  display:grid;
  grid-template-columns:58px minmax(0,1fr);
  align-items:center;
  gap:11px;
  width:min(390px,calc(100vw - (var(--safe-x) * 2)));
  min-height:74px;
  padding:8px 13px 8px 8px;
  border:1px solid rgba(255,48,79,.78);
  border-radius:13px;
  background:
    linear-gradient(
      90deg,
      rgba(3,4,7,.97),
      rgba(8,9,13,.88)
    );
  box-shadow:0 15px 38px rgba(0,0,0,.48);
  backdrop-filter:blur(14px);
  pointer-events:none;
  opacity:1;
  transform:translateY(0);
  transition:
    transform .5s cubic-bezier(.22,.75,.16,1),
    opacity .3s ease;
}

.now-logo{
  width:56px;
  height:56px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.16);
  border-radius:9px;
  background:linear-gradient(145deg,#50535c,#252830);
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.now-logo img{
  width:100%;
  height:100%;
  padding:4px;
  object-fit:contain;
  object-position:center;
  background:transparent;
}

.now-copy{
  min-width:0;
}

.watching-label{
  color:#ff4964;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.watching-title{
  margin-top:4px;
  font-size:clamp(16px,1.8vw,21px);
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.main-info{
  margin-top:4px;
  color:#c6cad3;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-live{
  display:inline-flex;
  align-items:center;
  margin-left:5px;
  padding:2px 7px;
  border-radius:99px;
  background:var(--red);
  color:#fff;
  font-size:7px;
}

/* =====================================================
   CONTROLES DEL REPRODUCTOR
   ===================================================== */

.controls-wrap{
  position:absolute;
  z-index:55;
  left:50%;
  bottom:calc(var(--bottom-ui-height) + 7px);
  transform:translateX(-50%);
  opacity:1;
  pointer-events:auto;
  transition:
    transform .5s cubic-bezier(.22,.75,.16,1),
    opacity .3s ease;
}

.controls-bar{
  min-width:245px;
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:5px 10px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;
  background:rgba(6,8,12,.89);
  box-shadow:0 13px 38px rgba(0,0,0,.53);
  backdrop-filter:blur(15px);
}

.control-btn,
.live-pill{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.08);
}

.control-btn{
  width:34px;
}

.control-btn:hover,
.control-btn:focus-visible,
.live-pill:focus-visible{
  background:rgba(255,255,255,.18);
}

.play-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:2px solid var(--red);
  border-radius:50%;
  background:rgba(9,11,17,.96);
  font-size:17px;
}

.live-pill{
  gap:6px;
  padding:0 9px;
  background:transparent;
  font-size:9px;
  font-weight:900;
  letter-spacing:.4px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 9px var(--red);
}

.right-controls{
  display:flex;
  gap:7px;
}

/* =====================================================
   PANEL INFERIOR SUPERPUESTO
   ===================================================== */

.guide-panel{
  position:absolute;
  z-index:40;
  inset:auto 0 0;
  width:100%;
  height:var(--bottom-ui-height);
  display:grid;
  grid-template-rows:33px 37px minmax(0,1fr);
  gap:5px;
  padding:
    6px
    var(--safe-x)
    max(6px,env(safe-area-inset-bottom));
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.72) 9%,
      rgba(0,0,0,.95) 27%,
      #000 100%
    );
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
  transition:
    transform .55s cubic-bezier(.22,.75,.16,1),
    opacity .32s ease;
}

/* =====================================================
   BUSCADOR Y FILTROS
   ===================================================== */

.guide-head{
  grid-row:1;
  height:33px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 43px;
}

.guide-tools{
  width:min(730px,72vw);
  height:33px;
  display:grid;
  grid-template-columns:minmax(230px,1fr) 165px 105px;
  gap:6px;
}

.search-input,
.filter-select{
  width:100%;
  height:33px;
  min-height:33px;
  padding:0 10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:8px;
  outline:0;
  background:rgba(16,19,27,.96);
  color:#fff;
  font-size:10px;
}

.search-input::placeholder{
  color:#8f96a5;
}

.search-input:focus,
.filter-select:focus{
  border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.18);
}

.filter-select option{
  background:#11141b;
  color:#fff;
}

/* =====================================================
   CARRUSELES Y FLECHAS
   ===================================================== */

.carousel-block{
  position:relative;
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 34px;
  align-items:center;
  gap:6px;
  overflow:visible;
}

.sections-block{
  grid-row:2;
  height:37px;
}

.channels-block{
  grid-row:3;
  min-height:0;
  height:100%;
  align-items:stretch;
}

.carousel-arrow{
  position:relative;
  z-index:90;
  width:34px;
  height:34px;
  min-width:34px;
  display:grid;
  place-items:center;
  padding:0 0 3px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
  background:rgba(18,21,28,.95);
  color:#fff;
  font-size:27px;
  line-height:1;
  box-shadow:0 5px 18px rgba(0,0,0,.46);
}

.carousel-arrow.left{
  grid-column:1;
}

.carousel-arrow.right{
  grid-column:3;
}

.carousel-arrow:hover,
.carousel-arrow:focus-visible{
  border-color:#fff;
  background:#2b303c;
  transform:scale(1.05);
}

.section-tabs,
.channel-list{
  grid-column:2;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
}

.section-tabs::-webkit-scrollbar,
.channel-list::-webkit-scrollbar{
  display:none;
}

/* =====================================================
   SECCIONES
   ===================================================== */

.section-tabs{
  height:37px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:1px 2px;
}

.section-tab{
  flex:0 0 auto;
  height:30px;
  padding:0 12px;
  border:1.5px solid var(--section-color);
  border-radius:99px;
  background:rgba(255,255,255,.025);
  color:var(--section-color);
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}

.section-tab:hover,
.section-tab:focus-visible{
  background:rgba(255,255,255,.1);
}

.section-tab.active{
  background:var(--section-color);
  color:#050609;
  box-shadow:0 0 16px var(--section-color);
}

.section-tab[data-section="adult"]{
  color:#ff5369;
}

/* =====================================================
   CANALES
   ===================================================== */

.channel-list{
  height:100%;
  display:flex;
  align-items:flex-start;
  gap:clamp(7px,.8vw,11px);
  padding:2px 3px 1px;
  scroll-padding-inline:4px;
}

.channel-card{
  --card-width:clamp(103px,10.4vw,145px);

  flex:0 0 var(--card-width);
  width:var(--card-width);
  min-width:var(--card-width);
  display:flex;
  flex-direction:column;
  gap:0;
  padding:0;
  border:0;
  border-radius:0;
  outline:0;
  background:transparent;
  color:#fff;
  text-align:center;
}

.channel-card:hover,
.channel-card:focus-visible,
.channel-card.active{
  background:transparent;
  transform:translateY(-1px);
}

.channel-logo{
  position:relative;
  width:100%;
  height:clamp(70px,11.2vh,100px);
  display:grid;
  place-items:center;
  overflow:hidden;
  border:2px solid var(--section-color);
  border-radius:10px;
  background:linear-gradient(145deg,#4d5059,#262930);
  box-shadow:0 7px 18px rgba(0,0,0,.4);
  color:#fff;
  font-size:17px;
  font-weight:900;
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.channel-logo img{
  position:absolute;
  inset:5px;
  width:calc(100% - 10px);
  height:calc(100% - 10px);
  max-width:calc(100% - 10px);
  max-height:calc(100% - 10px);
  margin:auto;
  padding:0;
  object-fit:contain;
  object-position:center;
  background:transparent;
}

.channel-card:hover .channel-logo,
.channel-card:focus-visible .channel-logo{
  transform:scale(1.025);
  box-shadow:
    0 0 0 2px #fff,
    0 9px 24px rgba(0,0,0,.52);
}

.channel-card.active .channel-logo{
  transform:scale(1.018);
  box-shadow:
    0 0 0 3px #fff,
    0 0 22px var(--section-color);
}

.card-live{
  position:absolute;
  z-index:5;
  top:4px;
  right:4px;
  padding:3px 5px;
  border-radius:5px;
  background:var(--red);
  color:#fff;
  font-size:6px;
  font-weight:900;
  line-height:1;
}

.channel-title{
  width:100%;
  height:18px;
  padding:4px 2px 0;
  overflow:hidden;
  color:#fff;
  font-size:clamp(8px,.78vw,10.5px);
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.empty-message{
  width:100%;
  min-width:100%;
  align-self:center;
  padding:18px;
  border:1px dashed rgba(255,255,255,.18);
  border-radius:10px;
  background:rgba(255,255,255,.04);
  color:#b8bdc8;
  font-size:11px;
  text-align:center;
}

/* =====================================================
   EFECTO DE OCULTAR INTERFAZ
   ===================================================== */

.player-stage.ui-hidden{
  cursor:none;
}

.player-stage.ui-hidden .guide-panel{
  opacity:0;
  pointer-events:none;
  transform:translateY(112%);
}

.player-stage.ui-hidden .controls-wrap{
  opacity:0;
  pointer-events:none;
  transform:
    translateX(-50%)
    translateY(calc(var(--bottom-ui-height) + 85px));
}

.player-stage.ui-hidden .now-playing{
  opacity:0;
  transform:translateY(-145%);
}

.player-stage.ui-hidden .video-vignette{
  opacity:0;
}

/* =====================================================
   ENFOQUE PARA ONN TV BOX
   ===================================================== */

button:focus-visible,
input:focus-visible,
select:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-height:760px){
  :root{
    --bottom-ui-height:clamp(170px,31vh,225px);
  }

  .guide-panel{
    grid-template-rows:30px 33px minmax(0,1fr);
    padding-top:4px;
  }

  .guide-head,
  .guide-tools{
    height:30px;
  }

  .search-input,
  .filter-select{
    height:30px;
    min-height:30px;
    font-size:9px;
  }

  .sections-block,
  .section-tabs{
    height:33px;
  }

  .section-tab{
    height:27px;
    padding:0 10px;
    font-size:8px;
  }

  .channel-logo{
    height:clamp(61px,10.5vh,80px);
  }

  .controls-wrap{
    bottom:calc(var(--bottom-ui-height) + 4px);
  }

  .controls-bar{
    min-height:40px;
    padding:3px 8px;
  }

  .play-btn{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .control-btn{
    width:30px;
    height:30px;
  }

  .live-pill{
    height:30px;
    font-size:8px;
  }
}

@media (max-width:850px){
  :root{
    --safe-x:8px;
    --bottom-ui-height:clamp(205px,39vh,285px);
  }

  .now-playing{
    top:8px;
    left:8px;
    width:min(330px,calc(100vw - 16px));
    grid-template-columns:48px minmax(0,1fr);
  }

  .now-logo{
    width:46px;
    height:46px;
  }

  .guide-head{
    margin:0 35px;
  }

  .guide-tools{
    width:100%;
    grid-template-columns:minmax(140px,1fr) 125px 75px;
  }

  .carousel-block{
    grid-template-columns:30px minmax(0,1fr) 30px;
    gap:5px;
  }

  .carousel-arrow{
    width:30px;
    min-width:30px;
    height:30px;
    font-size:24px;
  }

  .channel-card{
    --card-width:106px;
  }

  .channel-logo{
    height:74px;
  }
}

@media (max-width:560px){
  :root{
    --bottom-ui-height:clamp(220px,44vh,295px);
  }

  .guide-panel{
    grid-template-rows:59px 32px minmax(0,1fr);
  }

  .guide-head,
  .guide-tools{
    height:59px;
  }

  .guide-tools{
    grid-template-columns:1fr 1fr;
  }

  .search-input{
    grid-column:1/-1;
  }

  .search-input,
  .filter-select{
    height:28px;
    min-height:28px;
  }

  .channel-card{
    --card-width:94px;
  }

  .channel-logo{
    height:65px;
  }

  .main-info{
    display:none;
  }
}

@media (orientation:landscape) and (max-height:600px){
  :root{
    --bottom-ui-height:clamp(158px,34vh,195px);
  }

  .guide-panel{
    grid-template-rows:27px 30px minmax(0,1fr);
    padding-top:3px;
    padding-bottom:3px;
  }

  .guide-head,
  .guide-tools{
    height:27px;
  }

  .search-input,
  .filter-select{
    height:27px;
    min-height:27px;
    font-size:8px;
  }

  .sections-block,
  .section-tabs{
    height:30px;
  }

  .section-tab{
    height:24px;
    padding:0 8px;
    font-size:7.5px;
  }

  .channel-card{
    --card-width:90px;
  }

  .channel-logo{
    height:56px;
  }

  .channel-title{
    height:15px;
    padding-top:3px;
    font-size:7.5px;
  }

  .controls-bar{
    min-width:215px;
  }

  .now-playing{
    min-height:52px;
    padding:6px 10px 6px 6px;
  }

  .now-logo{
    width:42px;
    height:42px;
  }

  .watching-title{
    font-size:14px;
  }

  .main-info{
    display:none;
  }
}
</style>
</head>

<body>
<div class="tv-app">
  <main class="player-shell">
    <section class="player-stage" id="playerStage">

      <div id="player"></div>
      <div class="video-vignette"></div>

      <article class="now-playing">
        <div class="now-logo" id="nowLogo">TV</div>

        <div class="now-copy">
          <div class="watching-label">
            ▶ REPRODUCIENDO AHORA
            <span class="top-live">EN VIVO</span>
          </div>

          <h1 class="watching-title" id="nowTitle">
            Selecciona un canal
          </h1>

          <p class="main-info" id="mainInfo">
            Cargando listas M3U...
          </p>
        </div>
      </article>

      <div class="controls-wrap">
        <div class="controls-bar">
          <div class="live-pill">
            <span class="live-dot"></span>
            EN VIVO
          </div>

          <button
            class="control-btn play-btn"
            id="playButton"
            type="button"
            aria-label="Reproducir o pausar"
          >
            <span id="playIcon">▶</span>
          </button>

          <div class="right-controls">
            <button
              class="control-btn"
              id="pipButton"
              type="button"
              aria-label="Ventana pequeña"
              title="Ventana pequeña"
            >
              ▣
            </button>

            <button
              class="control-btn"
              id="fullscreenButton"
              type="button"
              aria-label="Pantalla completa"
              title="Pantalla completa"
            >
              ⛶
            </button>
          </div>
        </div>
      </div>

      <aside class="guide-panel" id="guidePanel">

        <header class="guide-head">
          <div class="guide-tools">
            <input
              class="search-input"
              id="searchInput"
              type="search"
              placeholder="Buscar en todas las secciones..."
              autocomplete="off"
            >

            <select
              class="filter-select"
              id="categoryFilter"
              aria-label="Categoría"
            >
              <option value="all">Todas las categorías</option>
            </select>

            <select
              class="filter-select"
              id="typeFilter"
              aria-label="Tipo"
            >
              <option value="all">Todo</option>
              <option value="video">TV</option>
              <option value="audio">Radio</option>
            </select>
          </div>
        </header>

        <div class="carousel-block sections-block">
          <button
            class="carousel-arrow left"
            id="sectionsLeft"
            type="button"
            aria-label="Secciones anteriores"
          >
            ‹
          </button>

          <nav
            class="section-tabs"
            id="sectionTabs"
            aria-label="Listas de canales"
          ></nav>

          <button
            class="carousel-arrow right"
            id="sectionsRight"
            type="button"
            aria-label="Secciones siguientes"
          >
            ›
          </button>
        </div>

        <div class="carousel-block channels-block">
          <button
            class="carousel-arrow left"
            id="channelsLeft"
            type="button"
            aria-label="Canales anteriores"
          >
            ‹
          </button>

          <div class="channel-list" id="channelList">
            <div class="empty-message">
              Cargando canales...
            </div>
          </div>

          <button
            class="carousel-arrow right"
            id="channelsRight"
            type="button"
            aria-label="Canales siguientes"
          >

/* =====================================================
   M3U
   ===================================================== */

function parseM3U(text){
  const lines = String(text || "")
    .replace(/\r/g,"")
    .split("\n");

  const channels = [];
  let pending = null;

  let pendingReferrer = "";
  let pendingUserAgent = "";
  let pendingOrigin = "";

  for(const rawLine of lines){
    const line = rawLine.trim();

    if(!line) continue;

    if(
      line.startsWith(
        "#EXTVLCOPT:http-referrer="
      )
    ){
      pendingReferrer = line
        .replace(
          "#EXTVLCOPT:http-referrer=",
          ""
        )
        .trim();

      continue;
    }

    if(
      line.startsWith(
        "#EXTVLCOPT:http-user-agent="
      )
    ){
      pendingUserAgent = line
        .replace(
          "#EXTVLCOPT:http-user-agent=",
          ""
        )
        .trim();

      continue;
    }

    if(
      line.startsWith(
        "#EXTVLCOPT:http-origin="
      )
    ){
      pendingOrigin = line
        .replace(
          "#EXTVLCOPT:http-origin=",
          ""
        )
        .trim();

      continue;
    }

    if(line.startsWith("#EXTINF")){
      const attributes =
        parseAttributes(line);

      const rawName = line.includes(",")
        ? line.substring(
            line.indexOf(",") + 1
          ).trim()
        : "Canal sin nombre";

      const cleanName =
        cleanChannelName(rawName);

      pending = {
        id:attributes["tvg-id"] || "",
        name:cleanName,
        rawName,
        logo:attributes["tvg-logo"] || "",
        category:
          attributes["group-title"] ||
          guessCategory(rawName),
        type:"video",
        url:"",
        referrer:pendingReferrer,
        userAgent:pendingUserAgent,
        origin:pendingOrigin
      };

      continue;
    }

    if(
      pending &&
      (
        line.startsWith("http://") ||
        line.startsWith("https://")
      )
    ){
      const stream =
        parseStreamLine(line);

      pending.url = stream.url;

      pending.referrer =
        stream.referrer ||
        pending.referrer;

      pending.userAgent =
        stream.userAgent ||
        pending.userAgent;

      pending.origin =
        stream.origin ||
        pending.origin;

      pending.type =
        guessChannelType(pending);

      channels.push(pending);
      pending = null;

      pendingReferrer = "";
      pendingUserAgent = "";
      pendingOrigin = "";
    }
  }

  return removeDuplicates(channels);
}

function parseAttributes(line){
  const result = {};
  const expression =
    /([\w-]+)="([^"]*)"/g;

  let match;

  while(
    (match = expression.exec(line)) !== null
  ){
    result[match[1]] = match[2];
  }

  return result;
}

function parseStreamLine(line){
  const parts = String(line).split("|");
  const url = parts.shift().trim();
  const options = parts.join("&");

  const result = {
    url,
    referrer:"",
    userAgent:"",
    origin:""
  };

  options.split("&").forEach(pair => {
    const separator =
      pair.indexOf("=");

    if(separator < 0) return;

    let key =
      pair.slice(0,separator).trim();

    let value =
      pair.slice(separator + 1).trim();

    try{
      key = decodeURIComponent(key);
    }catch(error){}

    try{
      value = decodeURIComponent(value);
    }catch(error){}

    key = key
      .toLowerCase()
      .replace(/[-_]/g,"");

    if(
      key === "referer" ||
      key === "referrer"
    ){
      result.referrer = value;
    }

    if(
      key === "useragent" ||
      key === "ua"
    ){
      result.userAgent = value;
    }

    if(key === "origin"){
      result.origin = value;
    }
  });

  return result;
}

function cleanChannelName(name){
  return String(name || "Canal")
    .replace(/\[[^\]]*]/g," ")
    .replace(
      /\b(?:FHD|UHD|HD|SD|4K|1080P|720P|480P)\b/gi,
      " "
    )
    .replace(/\s+/g," ")
    .trim();
}

function guessCategory(name){
  const text =
    String(name || "").toLowerCase();

  if(
    text.includes("adult") ||
    text.includes("18+")
  ){
    return "(+18)";
  }

  if(
    text.includes("noticia") ||
    text.includes("news") ||
    text.includes("milenio")
  ){
    return "Noticias";
  }

  if(
    text.includes("deporte") ||
    text.includes("sports") ||
    text.includes("futbol")
  ){
    return "Deportes";
  }

  if(
    text.includes("pelicula") ||
    text.includes("movie") ||
    text.includes("cine") ||
    text.includes("serie") ||
    text.includes("novela")
  ){
    return "Cine y Series";
  }

  if(
    text.includes("musica") ||
    text.includes("música") ||
    text.includes("radio")
  ){
    return "Música";
  }

  if(
    text.includes("infantil") ||
    text.includes("kids") ||
    text.includes("cartoon")
  ){
    return "Infantil";
  }

  return "General";
}

function guessChannelType(channel){
  const text =
    `${channel.name} ${channel.url}`
      .toLowerCase();

  return (
    text.includes("radio") ||
    text.includes("audio")
  )
    ? "audio"
    : "video";
}

function removeDuplicates(channels){
  const seen = new Set();

  return channels.filter(channel => {
    const url =
      String(channel.url || "").trim();

    if(!url || seen.has(url)){
      return false;
    }

    seen.add(url);
    return true;
  });
}

function buildPlaybackCandidates(channel){
  const direct = {
    mode:"directo",
    url:channel.url
  };

  const proxy = {
    mode:"proxy",
    url:buildProxyUrl(channel)
  };

  const pageUsesHttps =
    location.protocol === "https:";

  const streamUsesHttp =
    String(channel.url)
      .startsWith("http://");

  const directAllowed =
    !(pageUsesHttps && streamUsesHttp);

  const requiresHeaders =
    Boolean(
      channel.referrer ||
      channel.userAgent ||
      channel.origin
    );

  let candidates;

  if(
    requiresHeaders ||
    !directAllowed
  ){
    candidates = [proxy];

    if(directAllowed){
      candidates.push(direct);
    }
  }else{
    candidates = [direct,proxy];
  }

  const seen = new Set();

  return candidates.filter(candidate => {
    if(
      !candidate.url ||
      seen.has(candidate.url)
    ){
      return false;
    }

    seen.add(candidate.url);
    return true;
  });
}

function buildProxyUrl(channel){
  let url =
    PROXY_BASE +
    encodeURIComponent(channel.url);

  if(channel.referrer){
    url +=
      "&ref=" +
      encodeURIComponent(
        channel.referrer
      );
  }

  if(channel.userAgent){
    url +=
      "&ua=" +
      encodeURIComponent(
        channel.userAgent
      );
  }

  if(channel.origin){
    url +=
      "&origin=" +
      encodeURIComponent(
        channel.origin
      );
  }

  return url;
}

  index,
  sequence
){

    sequence !== playbackSequence ||
    !currentChannel
  ){
    return;
  }

  const candidate =
    playbackCandidates[index];

  if(!candidate){
    showPlaybackError();
    return;
  }

  playbackCandidateIndex = index;
  playbackStarted = false;

  clearTimeout(playbackTimer);
  destroyPlayer();

  mainInfo.textContent =
    `${currentChannel.sectionLabel} · Intentando ${candidate.mode}...`;

  const plugins = [];

  if(window.HlsjsPlayback){
    plugins.push(
      window.HlsjsPlayback
    );
  }

  const config = {
    source:candidate.url,
    parentId:"#player",
    plugins,
    autoPlay:true,
    mute:false,
    width:"100%",
    height:"100%",
    hideMediaControl:true,
    playback:{
      hlsjsConfig:{
        enableWorker:true,
        lowLatencyMode:true,
        liveSyncDurationCount:3,
        maxBufferLength:24,
        manifestLoadingMaxRetry:4,
        manifestLoadingRetryDelay:1000,
        levelLoadingMaxRetry:4,
        levelLoadingRetryDelay:1000,
        fragLoadingMaxRetry:4,
        fragLoadingRetryDelay:1000
      }
    },
    events:{
      onReady(){
        syncVideoEvents(sequence);
      },

      onPlay(){
        markPlaybackSuccess(
          sequence,
          candidate.mode
        );
      },

      onPause(){
        updatePlayButton();
      },

      onError(){
        tryNextCandidate(sequence);
      }
    }
  };

  const mimeType =
    inferMimeType(currentChannel.url);

  if(mimeType){
    config.mimeType = mimeType;
  }

  player =
    new Clappr.Player(config);

  playbackTimer = setTimeout(() => {
    if(
      sequence === playbackSequence &&
      !playbackStarted
    ){
      tryNextCandidate(sequence);
    }
  },PLAYBACK_TIMEOUT);

  setTimeout(
    updatePlayButton,
    650
  );
}

function syncVideoEvents(sequence){
  const video = getVideoElement();

  if(!video) return;

  video.addEventListener("play", () => {
    const candidate =
      playbackCandidates[
        playbackCandidateIndex
      ];

    markPlaybackSuccess(
      sequence,
      candidate?.mode || "automático"
    );
  });

  video.addEventListener(
    "playing",
    () => {
      const candidate =
        playbackCandidates[
          playbackCandidateIndex
        ];

      markPlaybackSuccess(
        sequence,
        candidate?.mode || "automático"
      );
    }
  );

  video.addEventListener(
    "pause",
    updatePlayButton
  );

  video.addEventListener("error", () => {
    tryNextCandidate(sequence);
  });
}

function markPlaybackSuccess(
  sequence,
  mode
){
  if(sequence !== playbackSequence){
    return;
  }

  playbackStarted = true;
  clearTimeout(playbackTimer);

  mainInfo.textContent =
    `${currentChannel.sectionLabel} · Reproduciendo por ${mode}`;

  updatePlayButton();
  showInterface();
}

function tryNextCandidate(sequence){
  if(sequence !== playbackSequence){
    return;
  }

  clearTimeout(playbackTimer);

  const nextIndex =
    playbackCandidateIndex + 1;

  if(
    nextIndex <
    playbackCandidates.length
  ){
    playbackCandidateIndex =
      nextIndex;

    setTimeout(() => {
      startPlaybackCandidate(
        nextIndex,
        sequence
      );
    },650);

    return;
  }

  showPlaybackError();
}

function showPlaybackError(){
  mainInfo.textContent =
    "No se pudo reproducir este canal. El enlace puede estar vencido, bloqueado o requerir autorización.";

  updatePlayButton();
}

function destroyPlayer(){
  clearTimeout(playbackTimer);

  if(player){
    try{
      player.destroy();
    }catch(error){}

    player = null;
  }

  const playerContainer =
    document.getElementById("player");

  playerContainer.innerHTML = "";
}

function inferMimeType(url){
  const value =
    String(url || "")
      .toLowerCase();

  if(value.includes(".m3u8")){
    return "application/vnd.apple.mpegurl";
  }

  if(value.includes(".mp4")){
    return "video/mp4";
  }

  if(value.includes(".mp3")){
    return "audio/mpeg";
  }

  return "";
}

/* =====================================================
   CONTROLES
   ===================================================== */

function getVideoElement(){
  return document.querySelector(
    "#player video"
  );
}

function togglePlay(){
  showInterface();

  const video =
    getVideoElement();

  if(!video) return;

  if(video.paused){
    video.play().catch(() => {});
  }else{
    video.pause();
  }

  updatePlayButton();
}

function updatePlayButton(){
  const video =
    getVideoElement();

  playIcon.textContent =
    !video || video.paused
      ? "▶"
      : "❚❚";
}

async function togglePictureInPicture(){
  showInterface();

  const video =
    getVideoElement();

  if(!video) return;

  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
    }else if(
      document.pictureInPictureEnabled
    ){
      await video.requestPictureInPicture();
    }
  }catch(error){}
}

async function toggleFullscreen(){
  showInterface();

  try{
    if(!document.fullscreenElement){
      await playerStage.requestFullscreen();

      if(
        screen.orientation &&
        screen.orientation.lock
      ){
        screen.orientation
          .lock("landscape")
          .catch(() => {});
      }
    }else{
      await document.exitFullscreen();
    }
  }catch(error){}
}

/* =====================================================
   INFORMACIÓN SUPERIOR
   ===================================================== */

function renderNowLogo(channel){
  const logo =
    channel.isAdult
      ? ADULT_CHANNEL_LOGO
      : channel.logo;

  nowLogo.innerHTML = "";

  if(logo){
    const image =
      document.createElement("img");

    image.src = logo;
    image.alt = channel.name;
    image.referrerPolicy =
      "no-referrer";

    image.addEventListener(
      "error",
      () => {
        nowLogo.textContent =
          getInitials(channel.name);
      }
    );

    nowLogo.appendChild(image);
  }else{
    nowLogo.textContent =
      getInitials(channel.name);
  }
}

/* =====================================================
   AUTO OCULTAR
   ===================================================== */

function showInterface(){
  playerStage.classList.remove(
    "ui-hidden"
  );

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {
    const activeElement =
      document.activeElement;

    const editing =
      activeElement &&
      ["INPUT","SELECT","TEXTAREA"]
        .includes(activeElement.tagName);

    const video =
      getVideoElement();

    if(
      !editing &&
      video &&
      !video.paused
    ){
      playerStage.classList.add(
        "ui-hidden"
      );
    }
  },UI_HIDE_DELAY);
}

/* =====================================================
   CONTROL REMOTO ONN TV BOX
   ===================================================== */

function handleRemoteControl(event){
  const interfaceWasHidden =
    playerStage.classList.contains(
      "ui-hidden"
    );

  if(interfaceWasHidden){
    showInterface();

    if(
      [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Enter"
      ].includes(event.key)
    ){
      event.preventDefault();
      event.stopImmediatePropagation();
    }

    return;
  }

  showInterface();

  const active =
    document.activeElement;

  const typing =
    active &&
    ["INPUT","SELECT","TEXTAREA"]
      .includes(active.tagName);

  if(typing) return;

  const channelCards = [
    ...channelList.querySelectorAll(
      ".channel-card"
    )
  ];

  const sectionButtons = [
    ...sectionTabs.querySelectorAll(
      ".section-tab"
    )
  ];

  if(active?.classList.contains(
    "channel-card"
  )){
    const index =
      channelCards.indexOf(active);

    if(event.key === "ArrowRight"){
      event.preventDefault();

      channelCards[
        Math.min(
          channelCards.length - 1,
          index + 1
        )
      ]?.focus();

      return;
    }

    if(event.key === "ArrowLeft"){
      event.preventDefault();

      channelCards[
        Math.max(0,index - 1)
      ]?.focus();

      return;
    }

    if(event.key === "ArrowUp"){
      event.preventDefault();

      const activeTab =
        sectionTabs.querySelector(
          ".section-tab.active"
        );

      activeTab?.focus();
      return;
    }

    if(event.key === "Enter"){
      event.preventDefault();
      active.click();
      return;
    }
  }

  if(active?.classList.contains(
    "section-tab"
  )){
    const index =
      sectionButtons.indexOf(active);

    if(event.key === "ArrowRight"){
      event.preventDefault();

      sectionButtons[
        Math.min(
          sectionButtons.length - 1,
          index + 1
        )
      ]?.focus();

      return;
    }

    if(event.key === "ArrowLeft"){
      event.preventDefault();

      sectionButtons[
        Math.max(0,index - 1)
      ]?.focus();

      return;
    }

    if(event.key === "ArrowDown"){
      event.preventDefault();

      const selectedCard =
        channelList.querySelector(
          ".channel-card.active"
        ) ||
        channelCards[0];

      selectedCard?.focus();
      return;
    }

    if(event.key === "ArrowUp"){
      event.preventDefault();
      searchInput.focus();
      return;
    }

    if(event.key === "Enter"){
      event.preventDefault();
      active.click();
      return;
    }
  }

  if(event.key === "ArrowDown"){
    const activeTab =
      sectionTabs.querySelector(
        ".section-tab.active"
      );

    if(active === searchInput){
      event.preventDefault();
      activeTab?.focus();
    }
  }

  if(
    event.key === " " &&
    !typing
  ){
    event.preventDefault();
    togglePlay();
  }

  if(
    event.key.toLowerCase() === "f"
  ){
    toggleFullscreen();
  }

  if(
    event.key === "Escape" ||
    event.key === "Backspace"
  ){
    if(document.fullscreenElement){
      event.preventDefault();
      document.exitFullscreen()
        .catch(() => {});
    }
  }
}

function loadFavorites(){
  try{
    const saved = JSON.parse(
      localStorage.getItem(
        FAVORITES_KEY
      ) || "[]"
    );

    return new Set(
      Array.isArray(saved)
        ? saved
        : []
    );
  }catch(error){
    return new Set();
  }
}

function saveFavorites(){
  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(
      [...favoriteUrls]
    )
  );
}

/* =====================================================
   UTILIDADES
   ===================================================== */

function getInitials(name){
  return String(name || "TV")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(word => word[0])
    .join("")
    .toUpperCase();
}

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
