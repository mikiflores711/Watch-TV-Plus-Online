<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TV en Vivo México - Clappr Proxy</title>

<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@clappr/hlsjs-playback@latest/dist/hlsjs-playback.min.js"></script>

<style>
:root{
  --bg:#06080c;
  --soft:#94a3b8;
  --text:#f8fafc;
  --line:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  background:linear-gradient(180deg,#0a0d12 0%, #030508 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

.app{
  max-width:1400px;
  margin:0 auto;
  padding:16px;
}

.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-weight:800;
  color:#dbeafe;
  box-shadow:var(--shadow);
}

.brand-text h1{
  font-size:20px;
}

.brand-text p{
  font-size:12px;
  color:var(--soft);
  margin-top:3px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 350px;
  gap:16px;
}

.player-card{
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.player-stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  cursor:none;
}

.player-stage.show-ui{
  cursor:default;
}

#player{
  width:100%;
  height:100%;
  background:#000;
}

#player video{
  object-fit:contain !important;
}

#player .media-control{
  display:none !important;
}

.video-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.watching-box,
.controls-wrap{
  opacity:0;
  transform:translateY(8px);
  transition:opacity .25s ease, transform .25s ease;
}

.player-stage.show-ui .watching-box,
.player-stage.show-ui .controls-wrap{
  opacity:1;
  transform:translateY(0);
}

.watching-box{
  position:absolute;
  top:14px;
  left:14px;
  width:min(640px, calc(100% - 28px));
  background:linear-gradient(180deg, rgba(55,65,81,.92), rgba(51,65,85,.92));
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  padding:12px 14px;
  pointer-events:none;
}

.watching-label{
  font-size:12px;
  font-weight:700;
  color:#d1d5db;
  letter-spacing:.6px;
  text-transform:uppercase;
}

.watching-title{
  font-size:18px;
  font-weight:800;
  color:#fff;
  margin-top:6px;
  line-height:1.25;
}

.controls-wrap{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  pointer-events:auto;
}

.controls-bar{
  background:linear-gradient(180deg, rgba(10,18,30,.88), rgba(5,10,18,.92));
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(14px);
  flex-wrap:wrap;
}

.ctrl-btn{
  height:34px;
  min-width:34px;
  padding:0 12px;
  border:none;
  border-radius:999px;
  background:#12213a;
  color:#fff;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  border:1px solid rgba(126,164,255,.15);
}

.ctrl-btn.small{
  min-width:34px;
  padding:0 10px;
  border-radius:50%;
}

.play-btn{
  background:#112849;
}

.volume-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:120px;
}

.slider{
  -webkit-appearance:none;
  appearance:none;
  width:90px;
  height:4px;
  border-radius:999px;
  background:rgba(126,164,255,.28);
  outline:none;
  cursor:pointer;
}

.slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#dbeafe;
  border:2px solid #0f172a;
}

.right-tools{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}

.pill{
  height:34px;
  padding:0 12px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
  border:1px solid rgba(255,255,255,.08);
  background:#12213a;
  color:#fff;
}

.pill.live{
  background:rgba(94,24,34,.9);
  color:#ffd6db;
  border-color:rgba(248,113,113,.35);
  gap:6px;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fca5a5;
  display:inline-block;
}

.player-footer{
  padding:14px 16px 16px;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.02);
}

.player-footer h2{
  font-size:20px;
  margin-bottom:4px;
}

.player-footer p{
  font-size:13px;
  color:var(--soft);
  line-height:1.4;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.side-card{
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
  box-shadow:var(--shadow);
}

.search-input,
.filter-select{
  width:100%;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0d1522;
  color:#fff;
  padding:0 14px;
  outline:none;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.channel-list{
  display:grid;
  gap:10px;
  max-height:75vh;
  overflow:auto;
}

.channel-item{
  background:linear-gradient(180deg,#101826,#0b111b);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.channel-item.active{
  border-color:rgba(126,164,255,.7);
  background:linear-gradient(180deg,#13203a,#0f172a);
}

.channel-logo{
  width:48px;
  height:48px;
  border-radius:12px;
  background:linear-gradient(135deg,#1e293b,#0f172a);
  display:grid;
  place-items:center;
  color:#dbeafe;
  font-weight:800;
  flex:0 0 48px;
}

.channel-text{
  min-width:0;
  flex:1;
}

.channel-text h3{
  font-size:14px;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-text p{
  font-size:12px;
  color:var(--soft);
}

.tag-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px;
}

.mini-tag{
  font-size:10px;
  padding:4px 7px;
  border-radius:999px;
  background:#162238;
  color:#dbeafe;
}

.warning-tag{
  background:rgba(248,113,113,.16);
  color:#fecaca;
}

.empty{
  text-align:center;
  color:var(--soft);
  padding:18px 12px;
  border:1px dashed rgba(255,255,255,.08);
  border-radius:12px;
}

@media (max-width:1100px){
  .layout{
    grid-template-columns:1fr;
  }

  .channel-list{
    max-height:none;
  }
}

@media (max-width:768px){
  .app{
    padding:10px;
  }

  .watching-box{
    top:10px;
    left:10px;
    width:calc(100% - 20px);
    padding:10px 12px;
  }

  .watching-title{
    font-size:15px;
  }

  .controls-wrap{
    left:8px;
    right:8px;
    bottom:8px;
  }

  .controls-bar{
    padding:8px;
    gap:8px;
  }

  .right-tools{
    margin-left:0;
  }

  .filters{
    grid-template-columns:1fr;
  }
}

@media (max-width:520px){
  .brand-text h1{
    font-size:17px;
  }

  .brand-text p{
    display:none;
  }

  .player-footer h2{
    font-size:17px;
  }

  .volume-wrap{
    min-width:auto;
  }

  .slider{
    width:68px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="brand-logo">TV</div>
    <div class="brand-text">
      <h1>TV en Vivo México</h1>
      <p>Clappr Player + Proxy HLS</p>
    </div>
  </div>

  <div class="layout">

    <section class="player-card">
      <div class="player-stage show-ui" id="playerStage">

        <div id="player"></div>

        <div class="video-overlay">

          <div class="watching-box">
            <div class="watching-label">
              ESTÁS VIENDO · <span id="topCategory">CANAL</span>
            </div>
            <div class="watching-title" id="topTitle">Selecciona un canal</div>
          </div>

          <div class="controls-wrap">
            <div class="controls-bar">

              <button class="ctrl-btn play-btn" id="playBtn">
                <span id="playIcon">▶</span>
                <span id="playText">Play</span>
              </button>

              <div class="volume-wrap">
                <button class="ctrl-btn small" id="muteBtn">🔊</button>
                <input class="slider" id="volumeBar" type="range" min="0" max="100" value="100" />
              </div>

              <div class="right-tools">
                <div class="pill live"><span class="live-dot"></span> DIRECTO</div>
                <button class="pill" id="proxyStatus">DIRECTO</button>
                <button class="ctrl-btn small" id="pipBtn">▣</button>
                <button class="ctrl-btn small" id="fullBtn">⤢</button>
              </div>

            </div>
          </div>

        </div>
      </div>

      <div class="player-footer">
        <h2 id="mainTitle">Selecciona un canal</h2>
        <p id="mainInfo">Elige un canal de la lista para iniciar la reproducción.</p>
      </div>
    </section>

    <aside class="sidebar">

      <div class="side-card">
        <input id="searchInput" class="search-input" type="text" placeholder="Buscar canal..." />

        <div class="filters">
          <select id="categoryFilter" class="filter-select">
            <option value="all">Todas las categorías</option>
          </select>

          <select id="typeFilter" class="filter-select">
            <option value="all">Todo</option>
            <option value="video">TV</option>
            <option value="audio">Radio</option>
          </select>
        </div>
      </div>

      <div class="side-card">
        <div class="channel-list" id="channelList"></div>
      </div>

    </aside>

  </div>
</div>

<script>
const PROXY_BASE = "https://hls-proxy-tv-plus.mikimc-business.workers.dev/proxy?url=";

const CHANNELS = [
  {
    name: "Acapulco Shore Pluto TV",
    quality: "AUTO",
    category: "Reality",
    type: "video",
    note: "Proxy HLS",
    useProxy: true,
    url: "https://jmp2.uk/plu-61a52615cbef2500072876e2.m3u8"
  },
  {
    name: "8NTV",
    quality: "1080p",
    category: "Regional",
    type: "video",
    note: "",
    useProxy: false,
    url: "https://60417ddeaf0d9.streamlock.net/ntv/videontv/playlist.m3u8"
  },
  {
    name: "ADN 40",
    quality: "720p",
    category: "Noticias",
    type: "video",
    note: "",
    useProxy: false,
    url: "https://mdstrm.com/live-stream-playlist/60b578b060947317de7b57ac.m3u8"
  },
  {
    name: "A+",
    quality: "1080p",
    category: "General",
    type: "video",
    note: "HTTP / Proxy",
    useProxy: true,
    url: "http://45.189.62.33:8002/play/a0oc/index.m3u8"
  }
];

const playerStage = document.getElementById("playerStage");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const playText = document.getElementById("playText");
const muteBtn = document.getElementById("muteBtn");
const volumeBar = document.getElementById("volumeBar");
const pipBtn = document.getElementById("pipBtn");
const fullBtn = document.getElementById("fullBtn");
const proxyStatus = document.getElementById("proxyStatus");

const topCategory = document.getElementById("topCategory");
const topTitle = document.getElementById("topTitle");
const mainTitle = document.getElementById("mainTitle");
const mainInfo = document.getElementById("mainInfo");

const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const typeFilter = document.getElementById("typeFilter");
const channelList = document.getElementById("channelList");

let player = null;
let currentChannel = null;
let currentUrl = "";
let hideTimer = null;

function init(){
  buildCategories();
  renderChannels();
  bindEvents();
  loadChannel(CHANNELS[0]);
  showPlayerUI();
}

function bindEvents(){
  playBtn.addEventListener("click", togglePlay);
  muteBtn.addEventListener("click", toggleMute);
  volumeBar.addEventListener("input", onVolumeChange);
  fullBtn.addEventListener("click", toggleFullscreen);
  pipBtn.addEventListener("click", togglePiP);

  searchInput.addEventListener("input", renderChannels);
  categoryFilter.addEventListener("change", renderChannels);
  typeFilter.addEventListener("change", renderChannels);

  ["mousemove", "touchstart", "click"].forEach(eventName => {
    playerStage.addEventListener(eventName, showPlayerUI);
  });

  playerStage.addEventListener("mouseleave", () => {
    hidePlayerUI(700);
  });

  document.addEventListener("keydown", () => {
    showPlayerUI();
  });
}

function loadChannel(channel){
  currentChannel = channel;
  currentUrl = channel.url;

  mainTitle.textContent = channel.name;
  mainInfo.textContent = `${channel.category} · ${channel.quality} · Cargando señal...`;
  topCategory.textContent = channel.category.toUpperCase();
  topTitle.textContent = channel.name;

  renderChannels();
  destroyPlayer();

  const streamUrl = getPlayableUrl(channel);

  proxyStatus.textContent = shouldUseProxy(channel) ? "PROXY" : "DIRECTO";

player = new Clappr.Player({
  source: streamUrl,
  parentId: "#player",

  plugins: [HlsjsPlayback],

  autoPlay: true,
  mute: false,
  width: "100%",
  height: "100%",
  hideMediaControl: true,

  mimeType: "application/vnd.apple.mpegurl",

  hlsPlayback: {
    preload: true
  },

  playback: {
    hlsjsConfig: {
      enableWorker: true,
      lowLatencyMode: true,
      liveSyncDurationCount: 3,
      maxBufferLength: 24,
      manifestLoadingMaxRetry: 4,
      levelLoadingMaxRetry: 4,
      fragLoadingMaxRetry: 4
    }
  },

  events: {
      onReady: function(){
        mainInfo.textContent = `${channel.category} · Listo`;
        syncVideoEvents();
      },
      onPlay: function(){
        updatePlayState();
        mainInfo.textContent = `${channel.category} · Reproduciendo en vivo`;
      },
      onPause: function(){
        updatePlayState();
      },
      onError: function(){
        mainInfo.textContent = "No se pudo reproducir. Puede ser señal caída, CORS, host no permitido o bloqueo del canal.";
      }
    }
  });

  showPlayerUI();
  setTimeout(updatePlayState, 500);
}

function shouldUseProxy(channel){
  if (channel.useProxy) return true;
  if (channel.url.startsWith("http://") && location.protocol === "https:") return true;
  if (channel.url.includes("jmp2.uk/plu-")) return true;
  return false;
}

function getPlayableUrl(channel){
  if (shouldUseProxy(channel)) {
    return PROXY_BASE + encodeURIComponent(channel.url);
  }

  return channel.url;
}

function destroyPlayer(){
  if(player){
    player.destroy();
    player = null;
  }

  document.getElementById("player").innerHTML = "";
}

function getPlayerVideo(){
  return document.querySelector("#player video");
}

function syncVideoEvents(){
  const video = getPlayerVideo();

  if(!video) return;

  video.addEventListener("play", updatePlayState);
  video.addEventListener("pause", updatePlayState);

  video.addEventListener("playing", () => {
    if(currentChannel){
      mainInfo.textContent = `${currentChannel.category} · Reproduciendo en vivo`;
    }
  });

  video.addEventListener("waiting", () => {
    if(currentChannel){
      mainInfo.textContent = `${currentChannel.category} · Cargando señal...`;
    }
  });

  video.addEventListener("error", () => {
    mainInfo.textContent = "Error de reproducción. Prueba usar proxy o revisar si el canal está activo.";
  });
}

function togglePlay(){
  showPlayerUI();

  const video = getPlayerVideo();

  if(!video) return;

  if(video.paused){
    video.play().catch(() => {});
  } else {
    video.pause();
  }

  updatePlayState();
}

function toggleMute(){
  showPlayerUI();

  const video = getPlayerVideo();

  if(!video) return;

  video.muted = !video.muted;
  updateVolumeUI();
}

function onVolumeChange(){
  showPlayerUI();

  const video = getPlayerVideo();

  if(!video) return;

  video.volume = Number(volumeBar.value) / 100;
  video.muted = video.volume === 0;

  updateVolumeUI();
}

function updateVolumeUI(){
  const video = getPlayerVideo();

  if(!video) return;

  if(video.muted || video.volume === 0){
    muteBtn.textContent = "🔇";
  } else if(video.volume < 0.5){
    muteBtn.textContent = "🔉";
  } else {
    muteBtn.textContent = "🔊";
  }

  volumeBar.value = Math.round((video.muted ? 0 : video.volume) * 100);
}

function updatePlayState(){
  const video = getPlayerVideo();

  if(!video || video.paused){
    playIcon.textContent = "▶";
    playText.textContent = "Play";
    playerStage.classList.add("show-ui");
  } else {
    playIcon.textContent = "❚❚";
    playText.textContent = "Pausa";
    showPlayerUI();
  }
}

async function togglePiP(){
  showPlayerUI();

  const video = getPlayerVideo();

  if(!video) return;

  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
    } else if(document.pictureInPictureEnabled){
      await video.requestPictureInPicture();
    }
  }catch(e){}
}

async function toggleFullscreen(){
  showPlayerUI();

  const target = document.querySelector(".player-card");

  try{
    if(!document.fullscreenElement){
      await target.requestFullscreen();

      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock("landscape").catch(() => {});
      }
    } else {
      await document.exitFullscreen();
    }
  }catch(e){}
}

function showPlayerUI(){
  playerStage.classList.add("show-ui");

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {
    hidePlayerUI();
  }, 3500);
}

function hidePlayerUI(delay = 0){
  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {
    const video = getPlayerVideo();

    if(video && !video.paused){
      playerStage.classList.remove("show-ui");
    }
  }, delay);
}

function buildCategories(){
  const categories = [...new Set(CHANNELS.map(ch => ch.category))].sort();

  categories.forEach(cat => {
    const option = document.createElement("option");
    option.value = cat;
    option.textContent = cat;
    categoryFilter.appendChild(option);
  });
}

function renderChannels(){
  const search = searchInput.value.trim().toLowerCase();
  const category = categoryFilter.value;
  const type = typeFilter.value;

  const filtered = CHANNELS.filter(ch => {
    const okSearch = ch.name.toLowerCase().includes(search);
    const okCat = category === "all" || ch.category === category;
    const okType = type === "all" || ch.type === type;
    return okSearch && okCat && okType;
  });

  channelList.innerHTML = "";

  if(!filtered.length){
    channelList.innerHTML = `<div class="empty">No se encontraron canales.</div>`;
    return;
  }

  filtered.forEach(ch => {
    const item = document.createElement("div");
    item.className = "channel-item";

    if(ch.url === currentUrl){
      item.classList.add("active");
    }

    item.innerHTML = `
      <div class="channel-logo">${getInitials(ch.name)}</div>
      <div class="channel-text">
        <h3>${escapeHtml(ch.name)}</h3>
        <p>${escapeHtml(ch.category)} · ${escapeHtml(ch.quality)}</p>
        <div class="tag-row">
          <span class="mini-tag">EN VIVO</span>
          <span class="mini-tag">${ch.type === "audio" ? "RADIO" : "TV"}</span>
          ${ch.note ? `<span class="mini-tag warning-tag">${escapeHtml(ch.note)}</span>` : ""}
          ${shouldUseProxy(ch) ? `<span class="mini-tag">PROXY</span>` : ""}
        </div>
      </div>
    `;

    item.addEventListener("click", () => loadChannel(ch));
    channelList.appendChild(item);
  });
}

function getInitials(name){
  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(w => w[0])
    .join("")
    .toUpperCase();
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

init();
</script>

</body>
</html>
