<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181821">
<title>Watch TV Plus</title>

<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@clappr/hlsjs-playback@latest/dist/hlsjs-playback.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<style>
:root{
  --bg:#171720;
  --panel:#1e1e29;
  --panel-2:#242432;
  --panel-3:#292938;
  --text:#f4f4f7;
  --muted:#b2b2bd;
  --blue:#3f70ff;
  --blue-soft:#3158d8;
  --line:rgba(255,255,255,.08);
  --danger:#e43e55;
  --safe-top:max(8px,env(safe-area-inset-top));
  --safe-bottom:max(8px,env(safe-area-inset-bottom));
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

.app-shell{
  width:min(100%,980px);
  min-height:100dvh;
  margin:0 auto;
  background:var(--bg);
  box-shadow:0 0 50px rgba(0,0,0,.75);
}

.topbar{
  height:58px;
  padding:var(--safe-top) 12px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#1a1a24;
}

.brand{
  min-width:100px;
  height:34px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:3px;
  background:linear-gradient(135deg,#38383e,#29292f);
  font-size:12px;
  font-weight:900;
  letter-spacing:.6px;
}

.brand-mark{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  border-radius:5px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
}

.top-actions{display:flex;align-items:center;gap:2px}

.icon-btn{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#f7f7fb;
  font-size:24px;
}
.icon-btn:focus-visible,.icon-btn:hover{background:rgba(255,255,255,.08)}

.player-stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:180px;
  overflow:hidden;
  background:#000;
  cursor:default;
}
#player{position:absolute;inset:0;width:100%;height:100%;background:#000}
#player video{width:100%!important;height:100%!important;object-fit:contain!important;background:#000!important}

.player-favorite-btn{
  position:absolute;
  z-index:80;
  top:10px;
  right:10px;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  background:rgba(17,17,25,.78);
  color:#fff;
  font-size:25px;
  line-height:1;
  box-shadow:0 5px 18px rgba(0,0,0,.45);
  backdrop-filter:blur(9px);
  transition:opacity .2s ease,transform .2s ease,color .2s ease,background .2s ease;
}
.player-favorite-btn:hover,.player-favorite-btn:focus-visible{
  transform:scale(1.06);
  background:rgba(32,32,45,.94);
}
.player-favorite-btn.active{
  color:#ffd34f;
  border-color:rgba(255,211,79,.75);
  background:rgba(73,54,6,.86);
}
.player-favorite-btn:disabled{
  opacity:.4;
  cursor:default;
}

.player-shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 38%,transparent 58%,rgba(0,0,0,.82));
  transition:opacity .22s ease;
}
.player-stage.show-ui .player-shade{opacity:1}

.now-box{
  position:absolute;
  top:10px;
  left:10px;
  right:58px;
  pointer-events:none;
  opacity:0;
  transform:translateY(-8px);
  transition:opacity .22s ease,transform .22s ease;
}
.player-stage.show-ui .now-box{opacity:1;transform:none}
.now-label{font-size:10px;font-weight:800;color:#d1d5db;text-transform:uppercase;letter-spacing:.7px}
.now-title{margin-top:4px;font-size:clamp(14px,3.6vw,20px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.controls{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
}
.player-stage.show-ui .controls{opacity:1;transform:none;pointer-events:auto}

.control-btn{
  height:36px;
  min-width:36px;
  padding:0 11px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  background:rgba(20,20,29,.88);
  color:#fff;
  font-size:12px;
  font-weight:800;
  backdrop-filter:blur(10px);
}
.control-btn.primary{background:var(--blue);border-color:var(--blue)}
.control-btn.right{margin-left:auto}

.status-strip{
  min-height:34px;
  padding:8px 13px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  flex-direction:column;
  gap:2px;
  border-bottom:1px solid var(--line);
  background:#191923;
  color:var(--muted);
  font-size:11px;
}
.status-strip strong{width:100%;min-width:0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-program{width:100%;color:#aeb5c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.signal-pill{flex:0 0 auto;color:#8facff;font-weight:800}

.main-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#1b1b25;
  border-bottom:1px solid var(--line);
}
.main-tab{
  position:relative;
  height:48px;
  border:0;
  background:transparent;
  color:#f3f3f6;
  font-size:18px;
}
.main-tab.active{color:var(--blue)}
.main-tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:2px;
  background:var(--blue);
}

.search-panel{
  display:none;
  gap:8px;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  background:#1b1b25;
}
.search-panel.open{display:grid;grid-template-columns:1fr auto}
.search-input{
  width:100%;
  height:40px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:8px;
  outline:0;
  background:#262633;
  padding:0 12px;
  color:#fff;
}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(63,112,255,.2)}
.reload-btn{
  height:40px;
  padding:0 13px;
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  font-size:12px;
  font-weight:800;
}

.scroll-tabs{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 9px 7px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
  background:#1b1b25;
}
.scroll-tabs::-webkit-scrollbar{display:none}

.provider-tabs{border-bottom:1px solid rgba(255,255,255,.05)}
.category-tabs{padding-top:6px;padding-bottom:9px;background:#1d1d28}

.tab-chip{
  flex:0 0 auto;
  min-height:32px;
  padding:0 11px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#f0f0f4;
  font-size:13px;
  white-space:nowrap;
}
.tab-chip:hover,.tab-chip:focus-visible{background:rgba(255,255,255,.08)}
.tab-chip.active{background:var(--blue);color:#fff;box-shadow:0 2px 9px rgba(63,112,255,.3)}
.tab-chip.adult{color:#ff8999}
.tab-chip.adult.active{background:#a61f34;color:#fff}

.adult-notice{
  display:none;
  padding:9px 12px;
  border-bottom:1px solid rgba(228,62,85,.3);
  background:rgba(120,22,37,.25);
  color:#ffc3cc;
  font-size:11px;
  line-height:1.4;
}

.list-head{
  height:32px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.06);
  background:#191923;
  color:#8e8e9a;
  font-size:10px;
}

.channel-list{background:#1c1c26;padding-bottom:var(--safe-bottom)}
.channel-row{
  position:relative;
  min-height:88px;
  display:grid;
  grid-template-columns:48px 42px minmax(0,1fr) 38px;
  align-items:center;
  gap:9px;
  padding:8px 9px;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.055);
  background:#20202b;
  color:#fff;
  text-align:left;
  transition:background .15s ease;
}
.channel-row:nth-child(even){background:#1e1e29}
.channel-row:hover,.channel-row:focus-within{background:#282837}
.channel-row.active{background:#22263a}
.channel-row.active .channel-number,.channel-row.active .channel-name,.channel-row.active .program-text{color:var(--blue)}

.channel-logo{
  width:46px;
  height:46px;
  overflow:hidden;
  display:grid;
  place-items:center;
  border-radius:5px;
  background:#292934;
  color:#d7d7df;
  font-size:11px;
  font-weight:900;
}
.channel-logo img{width:100%;height:100%;padding:3px;object-fit:contain;background:transparent}

.channel-number{font-size:16px;color:#e1e1e6;font-variant-numeric:tabular-nums}
.channel-copy{min-width:0}
.channel-name{font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.program-text{margin-top:5px;color:#c7c7d0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epg-text{width:100%;margin-top:5px;padding:0;border:0;background:transparent;color:#f0f0f2;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.epg-text:hover,.epg-text:focus-visible{color:#8facff;outline:none}
.epg-text.loading{color:#8f96a8}
.channel-row.active .epg-text{color:var(--blue)}
.channel-meta{display:none}

.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.favorite-btn{
  position:absolute;
  top:5px;
  right:43px;
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#8f8f9a;
  font-size:18px;
  opacity:.45;
}
.channel-row:hover .favorite-btn,.channel-row:focus-within .favorite-btn,.favorite-btn.active{opacity:1}
.favorite-btn.active{color:#ffd34f}

.play-arrow{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border:2px solid #a7a7b0;
  border-radius:50%;
  color:#bdbdc4;
  font-size:17px;
  line-height:1;
}
.channel-row.active .play-arrow{border-color:var(--blue);color:var(--blue)}

.empty{
  margin:12px;
  padding:20px 14px;
  border:1px dashed rgba(255,255,255,.12);
  border-radius:10px;
  background:#20202b;
  color:#aaaab6;
  text-align:center;
  font-size:13px;
  line-height:1.5;
}



/* Guía de programación */
.epg-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));}
.epg-modal.open{display:flex}
.epg-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
.epg-card{position:relative;width:min(720px,96vw);max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:linear-gradient(180deg,#20202c,#121219);box-shadow:0 25px 80px rgba(0,0,0,.72)}
.epg-head{display:grid;grid-template-columns:52px minmax(0,1fr) 40px;align-items:center;gap:11px;padding:13px;border-bottom:1px solid var(--line)}
.epg-logo{width:50px;height:50px;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:#fff;color:#111;font-weight:900}
.epg-logo img{width:100%;height:100%;padding:4px;object-fit:contain}
.epg-provider{color:#8facff;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.epg-title{margin-top:3px;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epg-close{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.09);font-size:22px}
.epg-status{padding:9px 13px;border-bottom:1px solid var(--line);color:#aeb4c3;font-size:11px}
.epg-list{min-height:170px;overflow-y:auto;padding:7px 11px 12px}
.epg-program{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.07);border-radius:8px}
.epg-program.current{background:linear-gradient(90deg,rgba(63,112,255,.42),rgba(63,112,255,.08));border-bottom-color:transparent}
.epg-time{color:#b7bdca;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.epg-program-title{font-size:14px;font-weight:800;line-height:1.25}
.epg-program-desc{margin-top:4px;color:#aeb4c2;font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.epg-badge{display:inline-flex;align-items:center;height:19px;margin-right:6px;padding:0 6px;border-radius:99px;background:var(--blue);font-size:8px;font-weight:900}
.epg-empty{padding:28px 15px;color:#adb3c1;text-align:center;font-size:12px;line-height:1.5}
.epg-actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.epg-action{height:34px;padding:0 12px;border:0;border-radius:8px;background:#2a2a39;font-size:11px;font-weight:900}
.epg-action.primary{background:var(--blue)}
@media(max-width:560px){.epg-card{width:100%;max-height:94dvh}.epg-program{grid-template-columns:76px minmax(0,1fr)}}

@media (min-width:760px){
  .app-shell{width:min(100%,1100px)}
  .topbar{height:64px}
  .player-stage{aspect-ratio:16/8.4}
  .channel-list{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#15151d}
  .channel-row{border-right:1px solid rgba(255,255,255,.045)}
  .main-tab{font-size:20px}
}

@media (orientation:landscape) and (max-height:560px){
  .topbar{height:44px;padding-top:4px}
  .brand{height:29px}
  .player-stage{aspect-ratio:16/7.4;min-height:190px}
  .status-strip{display:none}
  .main-tab{height:40px;font-size:16px}
  .scroll-tabs{padding-top:5px;padding-bottom:5px}
  .tab-chip{min-height:29px;font-size:12px}
}

<div class="app-shell">

function parseM3U(text){
  const lines = String(text || "").replace(/\r/g,"").split("\n");
  const channels = [];
  let current = null;
  let pendingReferrer = "";
  let pendingUserAgent = "";

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line) continue;

    if(line.startsWith("#EXTVLCOPT:http-referrer=")){
      pendingReferrer = line.replace("#EXTVLCOPT:http-referrer=","").trim();
      if(current) current.referrer = pendingReferrer;
      continue;
    }

    if(line.startsWith("#EXTVLCOPT:http-user-agent=")){
      pendingUserAgent = line.replace("#EXTVLCOPT:http-user-agent=","").trim();
      if(current) current.userAgent = pendingUserAgent;
      continue;
    }

    if(line.startsWith("#EXTINF")){
      const attrs = getAttributes(line);
      const rawName = line.includes(",") ? line.substring(line.indexOf(",") + 1).trim() : "Canal sin nombre";
      const parsed = parseChannelName(rawName);
      current = {
        id:attrs["tvg-id"] || attrs["channel-id"] || "",
        channelNumber:attrs["tvg-chno"] || "",
        rawName,
        name:parsed.name,
        quality:parsed.quality,
        note:parsed.note,
        logo:attrs["tvg-logo"] || "",
        tvgName:attrs["tvg-name"] || parsed.name,
        provider:(attrs["provider"] || "").toLowerCase(),
        epgId:attrs["epg-id"] || attrs["epgid"] || "",
        contentId:attrs["content-id"] || attrs["contentid"] || "",
        plutoId:attrs["pluto-id"] || "",
        officialUrl:attrs["official-url"] || "",
        category:attrs["group-title"] || guessCategory(rawName,attrs["tvg-id"] || ""),
        type:"video",
        url:"",
        referrer:pendingReferrer,
        userAgent:pendingUserAgent
      };
      continue;
    }

    if(current && (line.startsWith("http://") || line.startsWith("https://"))){
      const stream = parseStreamLine(line);
      current.url = stream.url;
      current.referrer = stream.referrer || current.referrer;
      current.userAgent = stream.userAgent || current.userAgent;
      current.type = guessType(current);
      channels.push(current);
      current = null;
      pendingReferrer = "";
      pendingUserAgent = "";
    }
  }

  return removeDuplicateChannels(channels);
}

function extractEpgUrls(text){
  const header = String(text || "").replace(/\r/g, "").split("\n").find(line => line.trim().startsWith("#EXTM3U")) || "";
  const attrs = getAttributes(header);
  const raw = attrs["url-tvg"] || attrs["x-tvg-url"] || attrs["tvg-url"] || "";
  return raw.split(/[,;]/).map(value => value.trim()).filter(Boolean).map(value => {
    try{return new URL(value, location.href).toString()}catch(error){return value}
  });
}

function getAttributes(line){
  const attrs = {};
  const regex = /([\w-]+)="([^"]*)"/g;
  let match;
  while((match = regex.exec(line)) !== null) attrs[match[1]] = match[2];
  return attrs;
}

function parseStreamLine(line){
  const parts = String(line).split("|");
  const url = parts.shift().trim();
  const options = parts.join("&");
  const result = {url,referrer:"",userAgent:""};

  options.split("&").forEach(pair => {
    const separator = pair.indexOf("=");
    if(separator < 0) return;
    let key = pair.slice(0,separator).trim();
    let value = pair.slice(separator + 1).trim();
    try{key = decodeURIComponent(key)}catch(error){}
    try{value = decodeURIComponent(value)}catch(error){}
    key = key.toLowerCase().replace(/[-_]/g,"");
    if(key === "referer" || key === "referrer") result.referrer = value;
    if(key === "useragent" || key === "ua") result.userAgent = value;
  });

  return result;
}

function parseChannelName(rawName){
  let name = String(rawName || "Canal sin nombre").trim();
  let quality = "AUTO";
  let note = "";
  const notes = [...name.matchAll(/\[([^\]]+)]/g)].map(match => match[1]);
  if(notes.length){
    note = notes.join(" / ");
    name = name.replace(/\s*\[[^\]]+]/g,"").trim();
  }
  const qualityMatch = name.match(/\(([^)]*(?:p|HD|SD|4K)[^)]*)\)/i);
  if(qualityMatch){
    quality = qualityMatch[1].trim();
    name = name.replace(/\s*\([^)]*(?:p|HD|SD|4K)[^)]*\)/i,"").trim();
  }
  return {name:name || rawName,quality,note};
}

function guessCategory(name,id){
  const text = `${name || ""} ${id || ""}`.toLowerCase();
  if(text.includes("adult") || text.includes("18+")) return "(+18)";
  if(/noticia|news|milenio|euronews|cbs|adn/.test(text)) return "Noticias";
  if(/deporte|sports|futbol|fútbol|fifa|dazn|espn|nba|lucha/.test(text)) return "Deportes";
  if(/anime|naruto|one piece|dragon ball|boruto|avatar/.test(text)) return "Anime";
  if(/kids|nick|baby|infantil|junior|cartoon/.test(text)) return "Infantil";
  if(/music|música|musica|mtv|telehit|stingray|concert/.test(text)) return "Música";
  if(/cine|movie|film|pelicula|película|series|novelas|amc|sony|golden/.test(text)) return "Cine y Series";
  if(/document|history|historia|discovery|nature/.test(text)) return "Documental";
  if(text.includes("radio")) return "Radio";
  return "General";
}

function guessType(channel){
  const text = `${channel.name} ${channel.id} ${channel.url}`.toLowerCase();
  return text.includes("radio") || text.includes("/radio") || text.includes("audio") ? "audio" : "video";
}

function removeDuplicateChannels(list){
  const seen = new Set();
  return list.filter(channel => {
    const key = String(channel.url || "").trim();
    if(!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

      adultUnlocked = true;
      localStorage.setItem(ADULT_UNLOCK_KEY,"1");

    activeSection = section;
    lastNormalSection = section;

  selectedCategory = "all";
  sortPopular = false;

function renderChannels(){
  const search = searchInput.value.trim().toLowerCase();
  const globalSearch = Boolean(search);
  let source = globalSearch
    ? allChannels.filter(channel => !channel.isAdult)
    : getSectionChannels(true);

  if(!globalSearch && activeSection === "adult" && !adultUnlocked){
    channelList.innerHTML = `<div class="empty">Sección bloqueada. Presiona <b>(+18)</b> y confirma que eres mayor de edad.</div>`;
    sectionInfo.textContent = "Sección bloqueada";
    countPill.textContent = "0";
    return;
  }

  let filtered = source.filter(channel => {
    const searchable = `${channel.name} ${channel.rawName} ${channel.id} ${channel.category} ${channel.sectionLabel}`.toLowerCase();
    return (!search || searchable.includes(search)) && (selectedCategory === "all" || channel.category === selectedCategory);
  });

  if(sortPopular){
    filtered = [...filtered].sort((a,b) => {
      const favDifference = Number(isFavorite(b.url)) - Number(isFavorite(a.url));
      return favDifference || a.name.localeCompare(b.name,"es");
    });
  }

  channelList.innerHTML = "";
  const limit = search ? MAX_RENDER_WITH_SEARCH : MAX_RENDER_DEFAULT;
  const shown = filtered.slice(0,limit);

  sectionInfo.textContent = globalSearch
    ? "Resultados en todas las secciones"
    : (activeSection === "favorites"
        ? "Canales favoritos"
        : (PLAYLISTS.find(item => item.id === activeSection)?.label || "Canales"));
  countPill.textContent = `${shown.length}`;

  if(!shown.length){
    channelList.innerHTML = `<div class="empty">${activeSection === "favorites" ? "Todavía no tienes canales favoritos. Presiona la estrella de un canal para guardarlo." : "No se encontraron canales."}</div>`;
    return;
  }

  const fragment = document.createDocumentFragment();
  shown.forEach((channel,index) => fragment.appendChild(createChannelItem(channel,index)));
  channelList.appendChild(fragment);
  prefetchVisibleEpg(shown.slice(0, EPG_PREFETCH_LIMIT));
}

function shouldUseProxy(channel){
  if(USE_PROXY_FOR_ALL) return true;
  if(channel.url.startsWith("http://") && location.protocol === "https:") return true;
  if(channel.url.includes("jmp2.uk/plu-")) return true;
  if(channel.referrer || channel.userAgent) return true;
  return false;
}

function getPlayableUrl(channel){
  if(!shouldUseProxy(channel)) return channel.url;
  let url = PROXY_BASE + encodeURIComponent(channel.url);
  if(channel.referrer) url += "&ref=" + encodeURIComponent(channel.referrer);
  if(channel.userAgent) url += "&ua=" + encodeURIComponent(channel.userAgent);
  return url;
}

function destroyPlayer(){
  if(player){
    try{player.destroy()}catch(error){}
    player = null;
  }
  document.getElementById("player").innerHTML = "";
}

function normalizeEpgName(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\b(?:tv|hd|fhd|uhd|4k|pluto)\b/g, " ")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function parseXmltvDate(value){
  const match = String(value || "").trim().match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4}|Z)?/);
  if(!match) return NaN;
  const [,y,mo,d,h,mi,s="00",zone="+0000"] = match;
  let timestamp = Date.UTC(Number(y),Number(mo)-1,Number(d),Number(h),Number(mi),Number(s));
  if(zone !== "Z"){
    const sign = zone.startsWith("-") ? -1 : 1;
    const offsetMinutes = Number(zone.slice(1,3)) * 60 + Number(zone.slice(3,5));
    timestamp -= sign * offsetMinutes * 60000;
  }
  return timestamp;
}

async function fetchEpgBytes(url){
  const proxied = PROXY_BASE + encodeURIComponent(url);
  let response;
  try{
    response = await fetch(proxied, {cache:"no-store"});
    if(!response.ok) throw new Error("HTTP " + response.status);
  }catch(proxyError){
    response = await fetch(url, {cache:"no-store"});
    if(!response.ok) throw new Error("HTTP " + response.status);
  }
  return {buffer:await response.arrayBuffer(), contentType:response.headers.get("content-type") || ""};
}

async function decodeEpgPayload(url, payload){
  const bytes = new Uint8Array(payload.buffer);
  const gzip = /\.gz(?:$|[?#])/i.test(url) || /gzip/i.test(payload.contentType) || (bytes[0] === 0x1f && bytes[1] === 0x8b);
  if(!gzip) return new TextDecoder("utf-8").decode(bytes);
  if("DecompressionStream" in window){
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  if(window.pako) return new TextDecoder("utf-8").decode(window.pako.ungzip(bytes));
  throw new Error("El navegador no puede descomprimir la guía XMLTV");
}

async function loadXmltvSources(results){
  const tasks = [];
  results.forEach(result => {
    (result.epgUrls || []).forEach(url => {
      tasks.push(loadXmltvSource(url, result.channels));
    });
  });
  await Promise.allSettled(tasks);
  refreshEpgDisplay();
}

async function loadXmltvSource(url, channels){
  if(!url || epgSourceCache.has(url)) return epgSourceCache.get(url);
  const task = (async () => {
    const payload = await fetchEpgBytes(url);
    const xmlText = await decodeEpgPayload(url, payload);
    const parser = new DOMParser();
    const documentXml = parser.parseFromString(xmlText, "application/xml");
    if(documentXml.querySelector("parsererror")) throw new Error("XMLTV inválido");

    const relevantIds = new Set(channels.flatMap(channel => [channel.epgId, channel.id]).map(value => String(value || "")).filter(Boolean));
    const relevantNames = new Map();
    channels.forEach(channel => {
      [channel.name, channel.tvgName, channel.rawName].forEach(name => {
        const normalized = normalizeEpgName(name);
        if(normalized) relevantNames.set(normalized, channel);
      });
    });

    const acceptedIds = new Set();
    documentXml.querySelectorAll("channel").forEach(node => {
      const id = node.getAttribute("id") || "";
      const names = [...node.querySelectorAll("display-name")].map(item => item.textContent || "");
      if(relevantIds.has(id)) acceptedIds.add(id);
      names.forEach(name => {
        const normalized = normalizeEpgName(name);
        if(relevantNames.has(normalized)) acceptedIds.add(id);
        if(normalized) epgNameToKey.set(normalized, id);
      });
    });

    const now = Date.now();
    const lower = now - 3 * 60 * 60 * 1000;
    const upper = now + 30 * 60 * 60 * 1000;
    documentXml.querySelectorAll("programme").forEach(node => {
      const key = node.getAttribute("channel") || "";
      if(!acceptedIds.has(key)) return;
      const start = parseXmltvDate(node.getAttribute("start"));
      const stop = parseXmltvDate(node.getAttribute("stop"));
      if(!Number.isFinite(start) || !Number.isFinite(stop) || stop < lower || start > upper) return;
      const title = node.querySelector("title")?.textContent?.trim() || "Programa sin título";
      const description = node.querySelector("desc")?.textContent?.trim() || "";
      const subtitle = node.querySelector("sub-title")?.textContent?.trim() || "";
      const list = epgProgramsByKey.get(key) || [];
      list.push({start,stop,title,description,subtitle,source:"xmltv"});
      epgProgramsByKey.set(key,list);
    });

    acceptedIds.forEach(key => {
      const list = epgProgramsByKey.get(key) || [];
      list.sort((a,b) => a.start - b.start);
    });
    return true;
  })();
  epgSourceCache.set(url, task);
  return task;
}

function extractPlutoId(channel){
  const values = [channel.plutoId, channel.epgId, channel.url, channel.id].filter(Boolean).map(String);
  for(const value of values){
    const match = value.match(/(?:plu-|channel\/)([a-f0-9]{24})/i) || value.match(/\b([a-f0-9]{24})\b/i);
    if(match) return match[1];
  }
  return "";
}

function extractTubiContentId(channel){
  const values = [channel.contentId, channel.epgId, channel.url, channel.officialUrl].filter(Boolean).map(String);
  for(const value of values){
    const match = value.match(/(?:live\/|content[_-]?id[=/])?(\d{6,})/i);
    if(match) return match[1];
  }
  return "";
}

function channelEpgKey(channel){
  if(!channel) return "";
  for(const candidate of [channel.epgId, channel.id]){
    const exact = String(candidate || "");
    if(exact && epgProgramsByKey.has(exact)) return exact;
  }
  for(const name of [channel.tvgName, channel.name, channel.rawName]){
    const key = epgNameToKey.get(normalizeEpgName(name));
    if(key && epgProgramsByKey.has(key)) return key;
  }
  return exact;
}

function getProgramsForChannel(channel){
  const key = channel && channel._epgKey && epgProgramsByKey.has(channel._epgKey) ? channel._epgKey : channelEpgKey(channel);
  return key ? (epgProgramsByKey.get(key) || []) : [];
}

function getProgramSnapshot(channel){
  const now = Date.now();
  const programs = getProgramsForChannel(channel);
  const current = programs.find(program => program.start <= now && program.stop > now) || null;
  const next = programs.find(program => program.start > now) || null;
  return {programs,current,next};
}

function getEpgLine(channel){
  const snapshot = getProgramSnapshot(channel);
  if(snapshot.current){
    return {loading:false,text:`Ahora: ${snapshot.current.title} · ${formatClock(snapshot.current.start)}–${formatClock(snapshot.current.stop)}`};
  }
  if(epgPending.has(channel.url)) return {loading:true,text:"Cargando programación…"};
  if(snapshot.next) return {loading:false,text:`Próximo: ${snapshot.next.title} · ${formatClock(snapshot.next.start)}`};
  return {loading:false,text:"Programación no disponible"};
}

function formatClock(timestamp){
  return new Intl.DateTimeFormat("es-MX",{hour:"2-digit",minute:"2-digit",hour12:true}).format(new Date(timestamp));
}

function normalizeProviderPrograms(programs, source){
  return (Array.isArray(programs) ? programs : []).map(program => ({
    start:Date.parse(program.start),
    stop:Date.parse(program.stop),
    title:String(program.title || "Programa sin título"),
    description:String(program.description || ""),
    subtitle:String(program.subtitle || ""),
    source
  })).filter(program => Number.isFinite(program.start) && Number.isFinite(program.stop)).sort((a,b) => a.start - b.start);
}

async function fetchProviderEpg(channel, force=false){
  const provider = channel.provider || channel.section;
  let endpoint = "";
  if(provider === "pluto" || /jmp2\.uk\/plu-/i.test(channel.url)){
    const id = extractPlutoId(channel);
    if(id) endpoint = `${WORKER_BASE}/epg/pluto?channel_id=${encodeURIComponent(id)}&hours=${EPG_WINDOW_HOURS}`;
  }else if(provider === "tubi" || channel.section === "tubi"){
    const id = extractTubiContentId(channel);
    if(id) endpoint = `${WORKER_BASE}/epg/tubi?content_id=${encodeURIComponent(id)}`;
  }
  if(!endpoint) return [];

  const cacheKey = endpoint;
  const cached = epgRequestCache.get(cacheKey);
  if(!force && cached && Date.now() - cached.time < EPG_CACHE_TTL) return cached.programs;
  const response = await fetch(endpoint + (endpoint.includes("?") ? "&" : "?") + "v=" + Date.now(), {cache:"no-store"});
  if(!response.ok) throw new Error("EPG HTTP " + response.status);
  const payload = await response.json();
  let rawPrograms = [];
  if(payload.provider === "pluto") rawPrograms = payload.programs || [];
  if(payload.provider === "tubi") rawPrograms = payload.channel?.programs || payload.channels?.[0]?.programs || [];
  const programs = normalizeProviderPrograms(rawPrograms, payload.provider || provider);
  epgRequestCache.set(cacheKey,{time:Date.now(),programs});
  return programs;
}

async function ensureChannelEpg(channel, force=false){
  if(!channel || !channel.url) return [];
  const existing = getProgramsForChannel(channel);
  if(existing.length && !force) return existing;
  if(epgPending.has(channel.url)) return epgPending.get(channel.url);
  const task = (async () => {
    try{
      const programs = await fetchProviderEpg(channel, force);
      if(programs.length){
        const key = `provider:${channel.section}:${channel.id || channel.url}`;
        epgProgramsByKey.set(key, programs);
        channel._epgKey = key;
      }
      return programs;
    }finally{
      epgPending.delete(channel.url);
    }
  })();
  epgPending.set(channel.url, task);
  return task;
}

function prefetchVisibleEpg(channels){
  channels.filter(channel => !getProgramsForChannel(channel).length).slice(0, EPG_PREFETCH_LIMIT).forEach((channel,index) => {
    setTimeout(() => ensureChannelEpg(channel).then(() => {
      if(currentChannel === channel) updateCurrentProgrammeUI();
      const activeRow = [...channelList.querySelectorAll(".channel-row")].find(row => row.dataset.channelKey === `${channel.section}|${channel.url}`);
      if(activeRow){
        const element = activeRow.querySelector(".epg-text");
        if(element){
          const line = getEpgLine(channel);
          element.textContent = line.text;
          element.classList.toggle("loading", line.loading);
        }
      }
    }).catch(() => {}), index * 180);
  });
}

function updateCurrentProgrammeUI(){
  if(!currentChannel){
    mainProgram.textContent = "Programación no disponible";
    return;
  }
  const snapshot = getProgramSnapshot(currentChannel);
  mainProgram.textContent = snapshot.current
    ? `${snapshot.current.title} · ${formatClock(snapshot.current.start)}–${formatClock(snapshot.current.stop)}`
    : (epgPending.has(currentChannel.url) ? "Cargando programación…" : "Programación no disponible");
}

function refreshEpgDisplay(){
  updateCurrentProgrammeUI();
  channelList.querySelectorAll(".channel-row").forEach(row => {
    const channel = allChannels.find(item => `${item.section}|${item.url}` === row.dataset.channelKey);
    if(!channel) return;
    const element = row.querySelector(".epg-text");
    if(!element) return;
    const line = getEpgLine(channel);
    element.textContent = line.text;
    element.classList.toggle("loading", line.loading);
  });
}

function openSchedule(channel){
  epgModalChannel = channel;
  epgModal.classList.add("open");
  epgModal.setAttribute("aria-hidden","false");
  epgProvider.textContent = `${channel.sectionLabel} · ${channel.category}`;
  epgTitle.textContent = channel.name;
  epgLogo.innerHTML = channel.logo ? `<img src="${escapeHtml(channel.logo)}" alt="">` : escapeHtml(getInitials(channel.name));
  loadSchedule(channel, false);
  setTimeout(() => epgClose.focus(),30);
}

function closeSchedule(){
  epgModal.classList.remove("open");
  epgModal.setAttribute("aria-hidden","true");
  epgModalChannel = null;
}

async function loadSchedule(channel, force=false){
  epgStatus.textContent = "Consultando programación…";
  epgList.innerHTML = `<div class="epg-empty">Cargando programación…</div>`;
  try{
    await ensureChannelEpg(channel, force);
  }catch(error){
    console.warn("EPG:",error);
  }
  const snapshot = getProgramSnapshot(channel);
  const now = Date.now();
  const limit = now + EPG_WINDOW_HOURS * 60 * 60 * 1000;
  const programs = snapshot.programs.filter(program => program.stop > now - 30*60000 && program.start < limit);
  epgStatus.textContent = programs.length ? `Próximas ${EPG_WINDOW_HOURS} horas · ${programs.length} programas` : "Sin programación disponible para este canal";
  if(!programs.length){
    epgList.innerHTML = `<div class="epg-empty">Este canal no tiene una guía compatible o su identificador <b>tvg-id</b> no coincide con la fuente EPG.</div>`;
    return;
  }
  epgList.innerHTML = programs.map(program => {
    const current = program.start <= now && program.stop > now;
    return `<article class="epg-program ${current ? "current" : ""}">
      <div class="epg-time">${formatClock(program.start)}<br>${formatClock(program.stop)}</div>
      <div><div class="epg-program-title">${current ? '<span class="epg-badge">Ahora</span>' : ''}${escapeHtml(program.title)}</div>${program.description ? `<div class="epg-program-desc">${escapeHtml(program.description)}</div>` : ""}</div>
    </article>`;
  }).join("");
  refreshEpgDisplay();
}

function loadFavoriteUrls(){
  try{
    const saved = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
    return new Set(Array.isArray(saved) ? saved : []);
  }catch(error){
    return new Set();
  }
}
function saveFavoriteUrls(){localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favoriteUrls]))}
function isFavorite(url){return favoriteUrls.has(url)}
function updatePlayerFavoriteButton(){
  const available = Boolean(currentChannel && currentChannel.url);
  const favorite = available && isFavorite(currentChannel.url);

  playerFavoriteBtn.disabled = !available;
  playerFavoriteBtn.classList.toggle("active",favorite);
  playerFavoriteBtn.textContent = favorite ? "★" : "☆";
  playerFavoriteBtn.title = favorite ? "Quitar de favoritos" : "Agregar a favoritos";
  playerFavoriteBtn.setAttribute(
    "aria-label",
    favorite ? "Quitar canal actual de favoritos" : "Agregar canal actual a favoritos"
  );
}
function toggleFavorite(url){
  favoriteUrls.has(url) ? favoriteUrls.delete(url) : favoriteUrls.add(url);
  saveFavoriteUrls();
  updatePlayerFavoriteButton();
  renderChannels();
}
function getInitials(name){return String(name || "TV").split(" ").filter(Boolean).slice(0,2).map(word => word[0]).join("").toUpperCase()}
function escapeHtml(text){return String(text || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

init();
