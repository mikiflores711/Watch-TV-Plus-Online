<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15151e">
<title>Reportar canal | Watch TV Plus</title>
<style>
:root{--bg:#101017;--panel:#1b1b25;--panel2:#252533;--text:#f7f7f9;--muted:#a5a5b2;--blue:#4c78ff;--green:#2eb872;--red:#ef5b70;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1c1c2a 0,#101017 52%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;padding:20px}
.card{width:min(100%,650px);overflow:hidden;border:1px solid var(--line);border-radius:20px;background:rgba(27,27,37,.97);box-shadow:0 25px 75px rgba(0,0,0,.48)}
header{padding:22px;border-bottom:1px solid var(--line)}
.brand{font-size:23px;font-weight:900}
.subtitle{margin-top:6px;color:var(--muted);font-size:13px}
.channel{display:grid;grid-template-columns:72px 1fr;gap:15px;align-items:center;margin:18px;padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel2)}
.logo{width:72px;height:72px;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:#343445;font-weight:900}
.logo img{width:100%;height:100%;object-fit:contain;padding:6px}
.channel h1{margin:0;font-size:20px}
.meta{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5}
form{padding:0 18px 21px}
label{display:block;margin:16px 0 7px;font-size:13px;font-weight:900}
select,textarea,input{width:100%;border:1px solid var(--line);border-radius:11px;background:#292937;color:#fff;padding:12px;outline:none;font:inherit}
select:focus,textarea:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,120,255,.18)}
textarea{min-height:110px;resize:vertical}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button,a.btn{min-height:47px;display:grid;place-items:center;border:0;border-radius:11px;text-decoration:none;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#fff}
.secondary{background:#30303f;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.status{display:none;margin-top:14px;padding:13px;border-radius:10px;font-size:13px;line-height:1.5}
.status.show{display:block}
.status.ok{background:rgba(46,184,114,.14);color:#99f0bf;border:1px solid rgba(46,184,114,.32)}
.status.error{background:rgba(239,91,112,.13);color:#ffb0bc;border:1px solid rgba(239,91,112,.32)}
.small{margin-top:12px;color:#898996;font-size:11px;line-height:1.55}
@media(max-width:500px){body{padding:0}.card{min-height:100dvh;border:0;border-radius:0}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
<header>
  <div class="brand">Watch TV Plus</div>
  <div class="subtitle">Reportar un canal no disponible</div>
</header>

<section class="channel">
  <div class="logo" id="logoBox">TV</div>
  <div>
    <h1 id="channelName">Canal sin nombre</h1>
    <div class="meta" id="channelMeta">Número --- · TV · General</div>
  </div>
</section>

<form id="reportForm">
  <label for="reason">¿Cuál es el problema?</label>
  <select id="reason" required>
    <option value="Canal no reproduce">Canal no reproduce</option>
    <option value="Pantalla negra">Pantalla negra</option>
    <option value="Se corta constantemente">Se corta constantemente</option>
    <option value="Audio sin imagen">Audio sin imagen</option>
    <option value="Imagen sin audio">Imagen sin audio</option>
    <option value="Canal incorrecto">Canal incorrecto</option>
    <option value="Otro problema">Otro problema</option>
  </select>

  <label for="details">Detalles adicionales</label>
  <textarea id="details" maxlength="800" placeholder="Describe brevemente qué ocurre."></textarea>

  <label for="contact">Correo de contacto (opcional)</label>
  <input id="contact" type="email" maxlength="160" placeholder="usuario@correo.com">

  <div class="actions">
    <a class="btn secondary" id="backBtn" href="./index.html">Volver</a>
    <button class="primary" id="submitBtn" type="submit">Enviar reporte</button>
  </div>

  <div class="status" id="statusBox" role="status" aria-live="polite"></div>
  <div class="small">Se enviarán automáticamente el nombre, número, sección, categoría y enlace técnico del canal.</div>
</form>
</main>

<script>
"use strict";
const API_URL = "https://script.google.com/macros/s/AKfycbx0xQsu7a6fVQqNETwIdQv-PebzpHq2MQCbTHfHu_7Rqq2-l3eAKgoppzFsBiTe6VTS/exec";
const params = new URLSearchParams(location.search);
const data = {
  canal: params.get("canal") || params.get("nombre") || "Canal sin nombre",
  numero: params.get("numero") || "---",
  seccion: params.get("seccion") || "TV",
  categoria: params.get("categoria") || "General",
  logo: params.get("logo") || "",
  canalId: params.get("id") || "",
  stream: params.get("stream") || params.get("url") || "",
  volver: params.get("volver") || "index.html"
};

const form = document.getElementById("reportForm");
const submitBtn = document.getElementById("submitBtn");
const statusBox = document.getElementById("statusBox");
const logoBox = document.getElementById("logoBox");

document.getElementById("channelName").textContent = data.canal;
document.getElementById("channelMeta").textContent = `Número ${data.numero} · ${data.seccion} · ${data.categoria}`;
document.getElementById("backBtn").href = "./" + data.volver.replace(/^\.\//,"").replace(/[^a-zA-Z0-9._-]/g,"");

if(data.logo){
  const img = document.createElement("img");
  img.src = data.logo;
  img.alt = "";
  img.referrerPolicy = "no-referrer";
  img.onerror = () => { logoBox.textContent = "TV"; };
  logoBox.textContent = "";
  logoBox.appendChild(img);
}

function showStatus(message,type){
  statusBox.textContent = message;
  statusBox.className = "status show " + type;
}

form.addEventListener("submit",async event => {
  event.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "Enviando...";

  const payload = new URLSearchParams({
    action:"report",
    canal:data.canal,
    numero:data.numero,
    seccion:data.seccion,
    categoria:data.categoria,
    logo:data.logo,
    canalId:data.canalId,
    stream:data.stream,
    motivo:document.getElementById("reason").value,
    detalles:document.getElementById("details").value.trim(),
    contacto:document.getElementById("contact").value.trim(),
    pagina:document.referrer || location.href,
    userAgent:navigator.userAgent
  });

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body:payload.toString()
    });
    const result = await response.json();
    if(!result.ok) throw new Error(result.error || "No se pudo guardar");
    form.reset();
    showStatus(result.grouped
      ? `Reporte recibido. Este canal ya tenía reportes y ahora suma ${result.cantidad}.`
      : "Reporte enviado correctamente. Gracias por avisarnos.","ok");
  }catch(error){
    console.error(error);
    showStatus("No fue posible enviar el reporte. Inténtalo nuevamente en unos momentos.","error");
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = "Enviar reporte";
  }
});
</script>
</body>
</html>
